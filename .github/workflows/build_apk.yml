          }

          class _MushafTajweedTabState extends State<MushafTajweedTab> {
            int _selectedIdx = 0;

            void _showRuleSheet(TajweedNote note) {
              showModalBottomSheet(
                context: context,
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(22))),
                builder: (_) => SafeArea(
                  child: Padding(
                    padding: const EdgeInsets.all(20),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Row(
                          children: [
                            CircleAvatar(radius: 8, backgroundColor: note.color),
                            const SizedBox(width: 8),
                            Text(note.rule, style: TextStyle(fontFamily: 'Cairo', fontWeight: FontWeight.bold, fontSize: 17, color: note.color)),
                          ],
                        ),
                        const SizedBox(height: 10),
                        Center(child: Text(note.word, style: const TextStyle(fontFamily: 'AmiriQuran', fontSize: 34))),
                        const SizedBox(height: 10),
                        Text(note.tip, style: const TextStyle(fontSize: 14, height: 1.6)),
                      ],
                    ),
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final s = widget.surahs[_selectedIdx];
              final st = widget.state;

              return Column(
                children: [
                  Padding(
                    padding: const EdgeInsets.fromLTRB(14, 10, 14, 6),
                    child: Row(
                      children: [
                        Expanded(
                          child: DropdownButtonFormField<int>(
                            value: _selectedIdx,
                            decoration: InputDecoration(
                              contentPadding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
                              border: OutlineInputBorder(borderRadius: BorderRadius.circular(14)),
                            ),
                            items: List.generate(
                              widget.surahs.length,
                              (i) => DropdownMenuItem(value: i, child: Text('${widget.surahs[i].num}. ${widget.surahs[i].name}')),
                            ),
                            onChanged: (v) {
                              if (v != null) setState(() => _selectedIdx = v);
                            },
                          ),
                        ),
                        const SizedBox(width: 8),
                        FilterChip(
                          selected: st.tajweedColors,
                          label: const Text('ألوان التجويد', style: TextStyle(fontFamily: 'Cairo', fontSize: 12)),
                          onSelected: (v) {
                            st.tajweedColors = v;
                            st.save();
                          },
                        ),
                      ],
                    ),
                  ),
                  if (st.tajweedColors)
                    const Padding(
                      padding: EdgeInsets.symmetric(horizontal: 14, vertical: 4),
                      child: Wrap(
                        spacing: 12,
                        children: [
                          Text('● غنة', style: TextStyle(color: kTajGhunnah, fontWeight: FontWeight.bold, fontSize: 11)),
                          Text('● قلقلة', style: TextStyle(color: kTajQalqalah, fontWeight: FontWeight.bold, fontSize: 11)),
                          Text('● مدّ', style: TextStyle(color: kTajMadd, fontWeight: FontWeight.bold, fontSize: 11)),
                          Text('● إدغام/إخفاء/إقلاب', style: TextStyle(color: kTajIdgham, fontWeight: FontWeight.bold, fontSize: 11)),
                        ],
                      ),
                    ),
                  Expanded(
                    child: ListView.builder(
                      padding: const EdgeInsets.fromLTRB(16, 6, 16, 20),
                      itemCount: s.ayahs.length,
                      itemBuilder: (_, idx) {
                        final a = s.ayahs[idx];
                        final words = a.text.split(RegExp(r'\s+')).where((w) => w.isNotEmpty).toList();
                        return Container(
                          margin: const EdgeInsets.only(bottom: 10),
                          padding: const EdgeInsets.all(14),
                          decoration: BoxDecoration(
                            color: Theme.of(context).brightness == Brightness.dark ? const Color(0xFF10211B) : Colors.white,
                            borderRadius: BorderRadius.circular(16),
                            border: Border.all(color: kBorder),
                          ),
                          child: Wrap(
                            alignment: WrapAlignment.center,
                            spacing: 6,
                            runSpacing: 8,
                            children: [
                              for (int w = 0; w < words.length; w++)
                                Builder(builder: (_) {
                                  final note = st.tajweedColors ? TajweedAnalyzer.analyzeWord(words[w], w + 1 < words.length ? words[w + 1] : null) : null;
                                  return InkWell(
                                    onTap: note != null ? () => _showRuleSheet(note) : null,
                                    child: Text(
                                      words[w],
                                      style: TextStyle(
                                        fontFamily: 'AmiriQuran',
                                        fontSize: st.fontSize,
                                        height: 1.8,
                                        color: note?.color,
                                        decoration: note != null ? TextDecoration.underline : null,
                                        decorationStyle: TextDecorationStyle.dotted,
                                      ),
                                    ),
                                  );
                                }),
                              Text('﴿${QuranMatcher.toArabicDigits(a.num)}﴾', style: const TextStyle(fontFamily: 'AmiriQuran', fontSize: 22, color: kGold)),
                            ],
                          ),
                        );
                      },
                    ),
                  ),
                ],
              );
            }
          }

          // ============================================================================
          // TAB 3: LIVE 5-PERSON FIREBASE CHALLENGE ROOM
          // ============================================================================
          class FirebaseChallengeTab extends StatefulWidget {
            final List<SurahModel> surahs;
            final ItqanState state;
            final FlutterTts tts;
            const FirebaseChallengeTab({super.key, required this.surahs, required this.state, required this.tts});
            @override
            State<FirebaseChallengeTab> createState() => _FirebaseChallengeTabState();
          }

          class _FirebaseChallengeTabState extends State<FirebaseChallengeTab> {
            final _joinCtrl = TextEditingController();
            int _pickedSurahIdx = 66; // الملك
            Map<String, dynamic>? _room;
            bool _busy = false;
            Timer? _poller;

            @override
            void initState() {
              super.initState();
              if (widget.state.activeRoomCode.isNotEmpty && widget.state.firebaseUrl.isNotEmpty) {
                _refreshRoom(widget.state.activeRoomCode);
              }
              _poller = Timer.periodic(const Duration(seconds: 6), (_) {
                if (_room != null && widget.state.firebaseUrl.isNotEmpty && mounted) {
                  _refreshRoom(_room!['code']);
                }
              });
            }

            @override
            void dispose() {
              _poller?.cancel();
              _joinCtrl.dispose();
              super.dispose();
            }

            Future<void> _refreshRoom(String code) async {
              final data = await FirebaseRoomService.fetchRoom(widget.state.firebaseUrl, code);
              if (mounted && data != null) setState(() => _room = data);
            }

            Future<void> _createLiveRoom() async {
              if (widget.state.firebaseUrl.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('أضف رابط Firebase أولًا من تبويب «ملفي» لتفعيل الغرف الحية')));
                return;
              }
              setState(() => _busy = true);
              final code = 'ITQAN-${1000 + Random().nextInt(8999)}';
              final s = widget.surahs[_pickedSurahIdx];
              final name = widget.state.studentName.isEmpty ? 'منشئ الغرفة' : widget.state.studentName;
              final created = await FirebaseRoomService.createRoom(
                dbUrl: widget.state.firebaseUrl,
                roomCode: code,
                surahNum: s.num,
                surahName: s.name,
                hostName: name,
              );
              if (created != null) {
                widget.state.activeRoomCode = code;
                await widget.state.save();
                setState(() => _room = created);
              } else if (mounted) {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('تعذّر إنشاء الغرفة — تأكد من رابط Firebase وصلاحيات القراءة/الكتابة')));
              }
              if (mounted) setState(() => _busy = false);
            }

            Future<void> _joinRoom() async {
              final code = _joinCtrl.text.trim().toUpperCase();
              if (code.isEmpty || widget.state.firebaseUrl.isEmpty) return;
              setState(() => _busy = true);
              final data = await FirebaseRoomService.fetchRoom(widget.state.firebaseUrl, code);
              if (data != null) {
                final name = widget.state.studentName.isEmpty ? 'متسابق' : widget.state.studentName;
                await FirebaseRoomService.joinOrUpdateMember(
                  dbUrl: widget.state.firebaseUrl,
                  roomCode: code,
                  memberId: widget.state.memberId,
                  name: name,
                  done: false,
                  score: 0,
                  tajweed: 0,
                );
                widget.state.activeRoomCode = code;
                await widget.state.save();
                await _refreshRoom(code);
              } else if (mounted) {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('لم يتم العثور على غرفة بهذا الرمز')));
              }
              if (mounted) setState(() => _busy = false);
            }

            @override
            Widget build(BuildContext context) {
              final st = widget.state;
              final membersMap = (_room?['members'] as Map<String, dynamic>?) ?? {};
              final members = membersMap.values.map((e) => Map<String, dynamic>.from(e as Map)).toList()
                ..sort((a, b) => ((b['score'] ?? 0) as int).compareTo((a['score'] ?? 0) as int));

              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  if (st.firebaseUrl.isEmpty)
                    Container(
                      padding: const EdgeInsets.all(14),
                      margin: const EdgeInsets.only(bottom: 12),
                      decoration: BoxDecoration(color: kGold.withValues(alpha: 0.14), borderRadius: BorderRadius.circular(16), border: Border.all(color: kGold)),
                      child: const Text(
                        'لتشغيل التحدي الحي بين ٥ جوالات عبر الإنترنت: أضف رابط Firebase Realtime Database من تبويب «ملفي» ← «ربط حساب Firebase».',
                        style: TextStyle(fontSize: 12.5, height: 1.5),
                      ),
                    ),

                  if (_room == null) ...[
                    Container(
                      padding: const EdgeInsets.all(18),
                      decoration: BoxDecoration(
                        gradient: const LinearGradient(colors: [kEmerald, kEmeraldDeep]),
                        borderRadius: BorderRadius.circular(22),
                        border: Border.all(color: kGold),
                      ),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          const Text('أنشئ غرفة تحدي (٥ أشخاص)', style: TextStyle(fontFamily: 'Cairo', fontWeight: FontWeight.bold, fontSize: 19, color: Colors.white)),
                          const SizedBox(height: 6),
                          const Text('مقاعد حقيقية متزامنة عبر Firebase — الفائز ينال تاج «متقن اليوم».', style: TextStyle(color: Colors.white70, fontSize: 12)),
                          const SizedBox(height: 12),
                          DropdownButtonFormField<int>(
                            value: _pickedSurahIdx,
                            dropdownColor: kEmeraldDeep,
                            style: const TextStyle(color: Colors.white, fontFamily: 'Cairo'),
                            decoration: InputDecoration(
                              filled: true,
                              fillColor: Colors.black26,
                              border: OutlineInputBorder(borderRadius: BorderRadius.circular(14), borderSide: BorderSide.none),
                            ),
                            items: List.generate(widget.surahs.length, (i) => DropdownMenuItem(value: i, child: Text('${widget.surahs[i].num}. ${widget.surahs[i].name}'))),
                            onChanged: (v) {
                              if (v != null) setState(() => _pickedSurahIdx = v);
                            },
                          ),
                          const SizedBox(height: 12),
                          SizedBox(
                            width: double.infinity,
                            child: ElevatedButton(
                              style: ElevatedButton.styleFrom(backgroundColor: kGold, foregroundColor: kEmeraldDeep, padding: const EdgeInsets.symmetric(vertical: 13)),
                              onPressed: _busy ? null : _createLiveRoom,
                              child: Text(_busy ? 'جارٍ الإنشاء...' : 'إنشاء غرفة التحدي الآن', style: const TextStyle(fontFamily: 'Cairo', fontWeight: FontWeight.bold)),
                            ),
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(height: 16),
                    const Text('أو انضم لغرفة برمز الدعوة', style: TextStyle(fontFamily: 'Cairo', fontWeight: FontWeight.bold, fontSize: 15)),
                    const SizedBox(height: 8),
                    Row(
                      children: [
                        Expanded(
                          child: TextField(
                            controller: _joinCtrl,
                            textDirection: TextDirection.ltr,
                            decoration: InputDecoration(hintText: 'ITQAN-1234', border: OutlineInputBorder(borderRadius: BorderRadius.circular(14))),
                          ),
                        ),
                        const SizedBox(width: 8),
                        ElevatedButton(
                          style: ElevatedButton.styleFrom(backgroundColor: kEmerald, foregroundColor: kGoldLight, padding: const EdgeInsets.symmetric(horizontal: 18, vertical: 16)),
                          onPressed: _busy ? null : _joinRoom,
                          child: const Text('انضمام', style: TextStyle(fontFamily: 'Cairo', fontWeight: FontWeight.bold)),
                        ),
                      ],
                    ),
                  ] else ...[
                    Container(
                      padding: const EdgeInsets.all(18),
                      decoration: BoxDecoration(
                        gradient: const LinearGradient(colors: [kEmerald, kEmeraldDeep]),
                        borderRadius: BorderRadius.circular(22),
                        border: Border.all(color: kGold),
                      ),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceBetween,
                            children: [
                              Text('رمز الغرفة: ${_room!['code']}', style: const TextStyle(color: kGold, fontFamily: 'Cairo', fontWeight: FontWeight.bold)),
                              TextButton(
                                onPressed: () {
                                  widget.state.activeRoomCode = '';
                                  widget.state.save();
                                  setState(() => _room = null);
                                },
                                child: const Text('مغادرة', style: TextStyle(color: Colors.white60, fontSize: 12)),
                              ),
                            ],
                          ),
                          Text('تحدي ${_room!['surahName']}', style: const TextStyle(color: Colors.white, fontFamily: 'Cairo', fontWeight: FontWeight.bold, fontSize: 20)),
                          const SizedBox(height: 12),
                          Row(
                            children: [
                              Expanded(
                                child: ElevatedButton.icon(
                                  style: ElevatedButton.styleFrom(backgroundColor: kGold, foregroundColor: kEmeraldDeep),
                                  icon: const Icon(Icons.share_rounded, size: 18),
                                  label: const Text('دعوة عبر واتساب', style: TextStyle(fontFamily: 'Cairo', fontWeight: FontWeight.bold, fontSize: 12)),
                                  onPressed: () => Share.share('انضم لتحدي ${_room!['surahName']} في تطبيق إتقان! رمز الغرفة: ${_room!['code']}'),
                                ),
                              ),
                              const SizedBox(width: 8),
                              Expanded(
                                child: OutlinedButton.icon(
                                  style: OutlinedButton.styleFrom(foregroundColor: kGoldLight, side: const BorderSide(color: kGold)),
                                  icon: const Icon(Icons.mic_rounded, size: 18),
                                  label: const Text('سمّع الآن', style: TextStyle(fontFamily: 'Cairo', fontWeight: FontWeight.bold, fontSize: 12)),
                                  onPressed: () {
                                    final sn = (_room!['surahNum'] as int) - 1;
                                    Navigator.push(
                                      context,
                                      MaterialPageRoute(
                                        builder: (_) => ItqanCoachScreen(
                                          surah: widget.surahs[sn.clamp(0, 113)],
                                          state: widget.state,
                                          tts: widget.tts,
                                          challengeRoomCode: _room!['code'],
                                        ),
                                      ),
                                    ).then((_) => _refreshRoom(_room!['code']));
                                  },
