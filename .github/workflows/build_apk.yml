                    ),
                    const SizedBox(height: 14),
                    Text('المشاركون المباشرون (${members.length} / ٥)', style: const TextStyle(fontFamily: 'Cairo', fontWeight: FontWeight.bold, fontSize: 15)),
                    const SizedBox(height: 8),
                    for (int i = 0; i < 5; i++)
