name: Build ITQAN v4 Full Quran & Tajweed APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Initialize Flutter Android project
        run: |
          flutter create --platforms=android --org com.almahdali --project-name itqan_quran .
          mkdir -p assets/fonts assets/images assets/data lib

      - name: Bundle Complete 604-Page Madinah Mushaf, Arabic Fonts & Luxury ITQAN Calligraphy Splash
        run: |
          npm install --no-save quran-json@3.1.2 @fontsource/amiri-quran @fontsource/cairo @fontsource/tajawal
          python3 -m pip install --break-system-packages -q pillow fonttools brotli arabic-reshaper python-bidi
          python3 - << 'PREP_EOF'
          import glob
          import json
          import math
          import urllib.request
          from pathlib import Path
          import arabic_reshaper
          from bidi.algorithm import get_display
          from fontTools.ttLib import TTFont
          from PIL import Image, ImageDraw, ImageFont

          surahs_out = []
          try:
              req = urllib.request.Request(
                  "https://api.alquran.cloud/v1/quran/quran-uthmani",
                  headers={"User-Agent": "ITQAN-Builder/4.0"},
              )
              with urllib.request.urlopen(req, timeout=45) as resp:
                  raw = json.loads(resp.read().decode("utf-8"))
              for s in raw["data"]["surahs"]:
                  ayahs = []
                  for a in s["ayahs"]:
                      txt = a["text"]
                      if s["number"] not in (1, 9) and a["numberInSurah"] == 1:
                          bism = "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ "
                          if txt.startswith(bism):
                              txt = txt[len(bism):].strip()
                      ayahs.append({"n": a["numberInSurah"], "t": txt, "p": a.get("page", 1), "j": a.get("juz", 1)})
                  surahs_out.append({
                      "num": s["number"],
                      "name": s["name"],
                      "type": "مكية" if s.get("revelationType") == "Meccan" else "مدنية",
                      "page": ayahs[0]["p"] if ayahs else 1,
                      "ayahs": ayahs,
                  })
          except Exception:
              with open("node_modules/quran-json/dist/quran.json", "r", encoding="utf-8") as f:
                  raw = json.load(f)
              for s in raw:
                  ayahs = [{"n": v["id"], "t": v["text"], "p": 1, "j": 1} for v in s["verses"]]
                  surahs_out.append({
                      "num": s["id"],
                      "name": "سورة " + s["name"],
                      "type": "مكية" if s.get("type") == "meccan" else "مدنية",
                      "page": 1,
                      "ayahs": ayahs,
                  })

          assert len(surahs_out) == 114
          assert sum(len(s["ayahs"]) for s in surahs_out) == 6236
          with open("assets/data/quran_full.json", "w", encoding="utf-8") as f:
              json.dump(surahs_out, f, ensure_ascii=False, separators=(",", ":"))

          def convert_font(pkg, weight, out_path):
              matches = sorted(glob.glob(f"node_modules/@fontsource/{pkg}/files/*arabic*{weight}*.woff2"))
              if not matches:
                  matches = sorted(glob.glob(f"node_modules/@fontsource/{pkg}/files/*.woff2"))
              font = TTFont(matches[0])
              font.flavor = None
              font.save(out_path)

          convert_font("amiri-quran", "400", "assets/fonts/AmiriQuran-Regular.ttf")
          convert_font("cairo", "700", "assets/fonts/Cairo-Bold.ttf")
          convert_font("tajawal", "400", "assets/fonts/Tajawal-Regular.ttf")
          convert_font("tajawal", "700", "assets/fonts/Tajawal-Bold.ttf")

          # Luxury ITQAN Emerald & Gold Splash Background with Calligraphy Name "إتقان" + "ITQAN"
          def draw_star(draw, cx, cy, r_outer, r_inner, points, color, width=3):
              pts = []
              for i in range(points * 2):
                  ang = math.pi * i / points - math.pi / 2
                  r = r_outer if i % 2 == 0 else r_inner
                  pts.append((cx + r * math.cos(ang), cy + r * math.sin(ang)))
              draw.polygon(pts, outline=color)

          bg = Image.new("RGB", (1080, 1920), (11, 61, 46))
          d = ImageDraw.Draw(bg)
          for y in range(1920):
              t = y / 1920.0
              d.line([(0, y), (1080, y)], fill=(int(14 * (1 - t) + 5 * t), int(72 * (1 - t) + 32 * t), int(54 * (1 - t) + 24 * t)))
          # Ornamental double Islamic arch & frame
          d.rounded_rectangle((36, 36, 1044, 1884), radius=34, outline=(201, 162, 39), width=4)
          d.rounded_rectangle((56, 56, 1024, 1864), radius=28, outline=(95, 130, 108), width=2)
          d.arc((110, 140, 970, 1060), 180, 360, fill=(201, 162, 39), width=5)
          d.arc((140, 170, 940, 1030), 180, 360, fill=(232, 213, 149), width=2)
          d.line([(110, 600), (110, 1760)], fill=(201, 162, 39), width=4)
          d.line([(970, 600), (970, 1760)], fill=(201, 162, 39), width=4)
          # Radiant geometric star & open golden Mushaf
          draw_star(d, 540, 500, 165, 82, 8, (201, 162, 39))
          draw_star(d, 540, 500, 125, 62, 8, (232, 213, 149))
          d.rounded_rectangle((380, 415, 534, 585), radius=14, outline=(232, 213, 149), width=6)
          d.rounded_rectangle((546, 415, 700, 585), radius=14, outline=(232, 213, 149), width=6)
          # Render real Arabic calligraphy "إتقان" + "ITQAN" directly into the artwork!
          try:
              f_ar = ImageFont.truetype("assets/fonts/AmiriQuran-Regular.ttf", 190)
              f_en = ImageFont.truetype("assets/fonts/Cairo-Bold.ttf", 56)
              ar_txt = get_display(arabic_reshaper.reshape("إتقان"))
              bb = d.textbbox((0, 0), ar_txt, font=f_ar)
              d.text(((1080 - (bb[2] - bb[0])) // 2, 740), ar_txt, fill=(232, 213, 149), font=f_ar)
              en_txt = "I T Q A N"
              bb2 = d.textbbox((0, 0), en_txt, font=f_en)
              d.text(((1080 - (bb2[2] - bb2[0])) // 2, 1040), en_txt, fill=(201, 162, 39), font=f_en)
          except Exception:
              pass
          bg.save("assets/images/itqan_bg.png", "PNG")

          icon = Image.new("RGB", (512, 512), (11, 61, 46))
          idraw = ImageDraw.Draw(icon)
          idraw.ellipse((20, 20, 492, 492), fill=(6, 36, 27), outline=(201, 162, 39), width=14)
          draw_star(idraw, 256, 256, 170, 86, 8, (201, 162, 39))
          idraw.rounded_rectangle((170, 185, 252, 325), radius=10, outline=(232, 213, 149), width=8)
          idraw.rounded_rectangle((260, 185, 342, 325), radius=10, outline=(232, 213, 149), width=8)
          for folder, sz in [("mipmap-mdpi", 48), ("mipmap-hdpi", 72), ("mipmap-xhdpi", 96), ("mipmap-xxhdpi", 144), ("mipmap-xxxhdpi", 192)]:
              out = Path(f"android/app/src/main/res/{folder}")
              out.mkdir(parents=True, exist_ok=True)
              icon.resize((sz, sz), Image.Resampling.LANCZOS).save(out / "ic_launcher.png", "PNG")
          PREP_EOF
          rm -rf node_modules package.json package-lock.json

      - name: Write pubspec.yaml
        run: |
          cat << 'YAML_EOF' > pubspec.yaml
          name: itqan_quran
          description: تطبيق إتقان - ITQAN لحفظ القرآن الكريم والتجويد وتحدي الرفاق
          publish_to: 'none'
          version: 4.0.0+4
          environment:
            sdk: '>=3.2.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            shared_preferences: ^2.2.3
            flutter_tts: ^4.0.2
            flutter_local_notifications: ^17.2.2
            speech_to_text: ^7.0.0
            share_plus: ^10.1.4
            url_launcher: ^6.3.1
            record: ^6.2.1
            audioplayers: ^6.8.1
            path_provider: ^2.1.6
            http: ^1.6.0
          flutter:
            uses-material-design: true
            assets:
              - assets/images/itqan_bg.png
              - assets/data/quran_full.json
            fonts:
              - family: AmiriQuran
                fonts:
                  - asset: assets/fonts/AmiriQuran-Regular.ttf
              - family: Cairo
                fonts:
                  - asset: assets/fonts/Cairo-Bold.ttf
                    weight: 700
              - family: Tajawal
                fonts:
                  - asset: assets/fonts/Tajawal-Regular.ttf
                  - asset: assets/fonts/Tajawal-Bold.ttf
                    weight: 700
          YAML_EOF

      - name: Write ITQAN v4.0 lib/main.dart
        run: |
          cat << 'DART_EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'dart:math';
          import 'dart:ui' as ui;
          import 'package:flutter/material.dart';
          import 'package:flutter/rendering.dart';
          import 'package:flutter/services.dart';
          import 'package:flutter_localizations/flutter_localizations.dart';
          import 'package:flutter_tts/flutter_tts.dart';
          import 'package:flutter_local_notifications/flutter_local_notifications.dart';
          import 'package:speech_to_text/speech_to_text.dart' as stt;
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:share_plus/share_plus.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'package:record/record.dart';
          import 'package:audioplayers/audioplayers.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:http/http.dart' as http;

          final notificationsPlugin = FlutterLocalNotificationsPlugin();

          // ============================================================================
          // ITQAN EXCLUSIVE PALETTE (Strictly Deep Mushaf Emerald & Soft Gold)
          // ============================================================================
          const kEmerald = Color(0xFF0B3D2E);
          const kEmeraldDeep = Color(0xFF06241B);
          const kEmeraldSoft = Color(0xFFEAF3EF);
          const kGold = Color(0xFFC9A227);
          const kGoldLight = Color(0xFFE8D595);
          const kPaper = Color(0xFFFAF8F2);
          const kInk = Color(0xFF10241D);
          const kMuted = Color(0xFF5D6E67);
          const kBorder = Color(0xFFE5DFCE);
          const kDanger = Color(0xFFC0392B);
          const kDangerBg = Color(0xFFFDECEC);

          // Tajweed Highlight Colors
          const kTajGhunnah = Color(0xFFB58900);
          const kTajQalqalah = Color(0xFF147A5E);
          const kTajMadd = Color(0xFF1A6B8A);
          const kTajIdgham = Color(0xFFA0522D);

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            try {
              await notificationsPlugin.initialize(
                const InitializationSettings(
                  android: AndroidInitializationSettings('@mipmap/ic_launcher'),
                ),
              );
            } catch (_) {}
            runApp(const ItqanV4App());
          }

          // ============================================================================
          // DATA MODELS
          // ============================================================================
          class AyahModel {
            final int num;
            final String text;
            final int page;
            final int juz;
            const AyahModel({required this.num, required this.text, required this.page, required this.juz});
          }

          class SurahModel {
            final int num;
            final String name;
            final String type;
            final int page;
            final List<AyahModel> ayahs;
            const SurahModel({required this.num, required this.name, required this.type, required this.page, required this.ayahs});
          }

          class TajweedNote {
            final String word;
            final String rule;
            final String tip;
            final Color color;
            const TajweedNote({required this.word, required this.rule, required this.tip, required this.color});
          }

          class ReciteMistake {
            final int ayahNum;
            final String expectedWord;
            final String heardWord;
            const ReciteMistake({required this.ayahNum, required this.expectedWord, required this.heardWord});
          }

          class VoiceNoteItem {
            final String title;
            final String path;
            final String dateStr;
            const VoiceNoteItem({required this.title, required this.path, required this.dateStr});
            Map<String, dynamic> toJson() => {'t': title, 'p': path, 'd': dateStr};
            factory VoiceNoteItem.fromJson(Map<String, dynamic> m) =>
                VoiceNoteItem(title: m['t'] ?? '', path: m['p'] ?? '', dateStr: m['d'] ?? '');
          }

          class ReportArchiveItem {
            final String surahName;
            final int score;
            final int errors;
            final int tajweedCount;
            final String dateStr;
            const ReportArchiveItem({
              required this.surahName,
              required this.score,
              required this.errors,
              required this.tajweedCount,
              required this.dateStr,
            });
            Map<String, dynamic> toJson() => {'s': surahName, 'sc': score, 'e': errors, 't': tajweedCount, 'd': dateStr};
            factory ReportArchiveItem.fromJson(Map<String, dynamic> m) => ReportArchiveItem(
                  surahName: m['s'] ?? '',
                  score: m['sc'] ?? 100,
                  errors: m['e'] ?? 0,
                  tajweedCount: m['t'] ?? 0,
                  dateStr: m['d'] ?? '',
                );
          }

          // ============================================================================
          // RULE-BASED QURANIC TAJWEED ANALYZER (أحكام التجويد الحقيقية من النص العثماني)
          // ============================================================================
          class TajweedAnalyzer {
            static const _qalqalah = {'ق', 'ط', 'ب', 'ج', 'د'};
            static const _idgham = {'ي', 'ر', 'م', 'ل', 'و', 'ن'};
            static const _ikhfa = {'ص', 'ذ', 'ث', 'ك', 'ج', 'ش', 'ق', 'س', 'د', 'ط', 'ز', 'ف', 'ت', 'ض', 'ظ'};
            static final _tanween = RegExp(r'[\u064B\u064C\u064D]');
            static const _sukun = '\u0652';
            static const _uthmaniSukun = '\u06E1';
            static const _shadda = '\u0651';
            static const _maddSign = '\u0653';

            static String _firstBaseLetter(String w) {
              for (int i = 0; i < w.length; i++) {
                final code = w.codeUnitAt(i);
                if (code >= 0x0621 && code <= 0x064A && w[i] != 'ٱ') return w[i];
              }
              return '';
            }

            static TajweedNote? analyzeWord(String word, String? nextWord) {
              // 1. المدود (علامة المد العثمانية ٓ)
              if (word.contains(_maddSign)) {
                return TajweedNote(
                  word: word,
                  rule: 'مدّ (متصل / منفصل / لازم)',
                  tip: 'أطل صوت المدّ من ٤ إلى ٦ حركات بحسب نوع المدّ وتجنّب قصره.',
                  color: kTajMadd,
                );
              }
              // 2. غنة النون والميم المشددتين
              if (word.contains('ن$_shadda') || word.contains('م$_shadda')) {
                return TajweedNote(
                  word: word,
                  rule: 'غنة مشددة (حركتان)',
                  tip: 'أظهر الغنة من الخيشوم بمقدار حركتين كاملتين في النون أو الميم المشددة.',
                  color: kTajGhunnah,
                );
              }
              // 3. أحكام النون الساكنة والتنوين مع الكلمة التالية
              final hasTanween = _tanween.hasMatch(word);
              final endsNoonSakin = word.endsWith('ن$_sukun') || word.endsWith('ن$_uthmaniSukun') || word.endsWith('ن');
              if ((hasTanween || endsNoonSakin) && nextWord != null && nextWord.isNotEmpty) {
                final nxt = _firstBaseLetter(nextWord);
                if (nxt == 'ب') {
                  return TajweedNote(
                    word: word,
                    rule: 'إقلاب بغنة',
                    tip: 'اقلب النون الساكنة أو التنوين ميمًا مخفاة بغنة حركتين قبل حرف الباء.',
                    color: kTajIdgham,
                  );
                }
                if (_idgham.contains(nxt)) {
                  final withGhunnah = {'ي', 'ن', 'م', 'و'}.contains(nxt);
                  return TajweedNote(
                    word: word,
                    rule: withGhunnah ? 'إدغام بغنة' : 'إدغام بغير غنة',
                    tip: withGhunnah
                        ? 'أدغم النون/التنوين في الحرف التالي مع غنة بمقدار حركتين.'
                        : 'أدغم النون/التنوين إدغامًا كاملًا في اللام أو الراء دون غنة.',
                    color: kTajIdgham,
                  );
                }
                if (_ikhfa.contains(nxt)) {
                  return TajweedNote(
                    word: word,
                    rule: 'إخفاء حقيقي',
                    tip: 'أخفِ النون الساكنة أو التنوين بحالة وسط بين الإظهار والإدغام مع غنة حركتين.',
                    color: kTajIdgham,
                  );
                }
              }
              // 4. القلقلة (ق ط ب ج د ساكنة)
              for (final ch in _qalqalah) {
                if (word.contains('$ch$_sukun') || word.contains('$ch$_uthmaniSukun')) {
                  return TajweedNote(
                    word: word,
                    rule: 'قلقلة (قطب جد)',
                    tip: 'أحدث اضطرابًا خفيفًا في مخرج حرف «$ch» الساكن حتى يُسمع له نبرة واضحة.',
                    color: kTajQalqalah,
                  );
                }
              }
              return null;
            }

            static List<TajweedNote> analyzeAyah(String ayahText) {
              final words = ayahText.split(RegExp(r'\s+')).where((w) => w.isNotEmpty).toList();
              final notes = <TajweedNote>[];
              for (int i = 0; i < words.length; i++) {
                final next = i + 1 < words.length ? words[i + 1] : null;
                final n = analyzeWord(words[i], next);
                if (n != null) notes.add(n);
              }
              return notes;
            }
          }

          // ============================================================================
          // SMART UTHMANI-TO-STANDARD ARABIC MATCHER
          // ============================================================================
          class QuranMatcher {
            static final _diacritics = RegExp(r'[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640\u06DF-\u06E8\u06EA-\u06ED\u08D3-\u08FF]');
            static final _nonArabic = RegExp(r'[^\u0621-\u064A\s]');

            static String normalize(String input) {
              var s = input.replaceAll(_diacritics, '');
              s = s.replaceAll('ٱ', 'ا');
              s = s.replaceAll(RegExp(r'[أإآ]'), 'ا');
              s = s.replaceAll('ى', 'ي');
              s = s.replaceAll('ة', 'ه');
              s = s.replaceAll('ؤ', 'و');
              s = s.replaceAll('ئ', 'ي');
              s = s.replaceAll('ـ', '');
              s = s.replaceAll(_nonArabic, '');
              return s.trim();
            }

            static String skeleton(String w) {
              final n = normalize(w);
              if (n.length <= 2) return n;
              return n[0] + n.substring(1).replaceAll('ا', '');
            }

            static int levenshtein(String a, String b) {
              if (a == b) return 0;
              if (a.isEmpty) return b.length;
              if (b.isEmpty) return a.length;
              var prev = List<int>.generate(b.length + 1, (i) => i);
              for (int i = 1; i <= a.length; i++) {
                final curr = List<int>.filled(b.length + 1, 0);
                curr[0] = i;
                for (int j = 1; j <= b.length; j++) {
                  final cost = a[i - 1] == b[j - 1] ? 0 : 1;
                  curr[j] = min(min(curr[j - 1] + 1, prev[j] + 1), prev[j - 1] + cost);
                }
                prev = curr;
              }
              return prev[b.length];
            }

            static bool wordsMatch(String expectedRaw, String spokenRaw) {
              final e = normalize(expectedRaw);
              final s = normalize(spokenRaw);
              if (e.isEmpty || s.isEmpty) return false;
              if (e == s) return true;
              final es = skeleton(e);
              final ss = skeleton(s);
              if (es == ss) return true;
              if (e.length >= 4 && s.length >= 4 && levenshtein(es, ss) <= 1) return true;
              if (e.length >= 6 && s.length >= 6 && levenshtein(e, s) <= 2) return true;
              if (e.length >= 4 && (s.contains(e) || e.contains(s)) && (e.length - s.length).abs() <= 1) return true;
              return false;
            }

            static String toArabicDigits(int n) {
              const digits = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
              return n.toString().split('').map((c) {
                final d = int.tryParse(c);
                return d != null ? digits[d] : c;
              }).join();
            }

            static String firstLetterHint(String word) {
              final c = word.trim();
              if (c.isEmpty) return '';
              int end = 1;
              while (end < c.length && _diacritics.hasMatch(c[end])) {
                end++;
              }
              return '${c.substring(0, end)}...';
            }
          }

          // ============================================================================
          // FIREBASE REALTIME DATABASE SERVICE (Live 5-Person Challenge Rooms!)
          // Uses Firebase Realtime Database HTTPS REST API — zero build-time crash!
          // ============================================================================
          class FirebaseRoomService {
            static String cleanUrl(String raw) {
              var u = raw.trim();
              if (u.endsWith('/')) u = u.substring(0, u.length - 1);
              if (u.isNotEmpty && !u.startsWith('https://')) u = 'https://$u';
              return u;
            }

            static Future<bool> testConnection(String dbUrl) async {
              final base = cleanUrl(dbUrl);
              if (base.isEmpty) return false;
              try {
                final r = await http.get(Uri.parse('$base/itqan_ping.json')).timeout(const Duration(seconds: 8));
                return r.statusCode == 200;
              } catch (_) {
                return false;
              }
            }

            static Future<Map<String, dynamic>?> createRoom({
              required String dbUrl,
              required String roomCode,
              required int surahNum,
              required String surahName,
              required String hostName,
            }) async {
              final base = cleanUrl(dbUrl);
              final payload = {
                'code': roomCode,
                'surahNum': surahNum,
                'surahName': surahName,
                'createdAt': DateTime.now().toIso8601String(),
                'members': {
                  'host': {'name': hostName, 'done': false, 'score': 0, 'tajweed': 0},
                },
              };
              final r = await http
                  .put(
                    Uri.parse('$base/itqan_rooms/$roomCode.json'),
                    headers: {'Content-Type': 'application/json'},
                    body: jsonEncode(payload),
                  )
                  .timeout(const Duration(seconds: 10));
              if (r.statusCode == 200) return payload;
              return null;
            }

            static Future<Map<String, dynamic>?> fetchRoom(String dbUrl, String roomCode) async {
              final base = cleanUrl(dbUrl);
              final r = await http.get(Uri.parse('$base/itqan_rooms/$roomCode.json')).timeout(const Duration(seconds: 10));
              if (r.statusCode == 200 && r.body != 'null') {
                return jsonDecode(r.body) as Map<String, dynamic>;
              }
              return null;
            }

            static Future<bool> joinOrUpdateMember({
              required String dbUrl,
              required String roomCode,
              required String memberId,
              required String name,
              required bool done,
              required int score,
              required int tajweed,
            }) async {
              final base = cleanUrl(dbUrl);
              final r = await http
                  .put(
                    Uri.parse('$base/itqan_rooms/$roomCode/members/$memberId.json'),
                    headers: {'Content-Type': 'application/json'},
                    body: jsonEncode({'name': name, 'done': done, 'score': score, 'tajweed': tajweed}),
                  )
                  .timeout(const Duration(seconds: 10));
              return r.statusCode == 200;
            }
          }

          // ============================================================================
          // APP STATE
          // ============================================================================
          class ItqanState extends ChangeNotifier {
            ThemeMode themeMode = ThemeMode.light;
            double fontSize = 28.0;
            bool tajweedColors = true;
            bool liveTajweedCoach = true;
            bool vibrateOnError = true;
            String studentName = '';
            String firebaseUrl = 'https://itqan-quran-71868-default-rtdb.firebaseio.com';
            String activeRoomCode = '';
            String memberId = '';
            Set<int> masteredSurahs = {1};
            List<VoiceNoteItem> recordings = [];
            List<ReportArchiveItem> reports = [];

            Future<void> load() async {
              final p = await SharedPreferences.getInstance();
              themeMode = (p.getBool('itq_dark') ?? false) ? ThemeMode.dark : ThemeMode.light;
              fontSize = p.getDouble('itq_font') ?? 28.0;
              tajweedColors = p.getBool('itq_tajweed') ?? true;
              liveTajweedCoach = p.getBool('itq_coach') ?? true;
              vibrateOnError = p.getBool('itq_vib') ?? true;
              studentName = p.getString('itq_name') ?? '';
              final savedFb = p.getString('itq_fb_url') ?? '';
              firebaseUrl = savedFb.isEmpty ? 'https://itqan-quran-71868-default-rtdb.firebaseio.com' : savedFb;
              activeRoomCode = p.getString('itq_room') ?? '';
              memberId = p.getString('itq_uid') ?? 'u_${10000 + Random().nextInt(89999)}';
              await p.setString('itq_uid', memberId);

              final m = p.getStringList('itq_mastered');
              if (m != null) masteredSurahs = m.map((e) => int.tryParse(e) ?? 1).toSet();
              final rRaw = p.getString('itq_recs');
              if (rRaw != null) {
                try {
                  recordings = (jsonDecode(rRaw) as List).map((e) => VoiceNoteItem.fromJson(e)).toList();
                } catch (_) {}
              }
              final repRaw = p.getString('itq_reps');
              if (repRaw != null) {
                try {
                  reports = (jsonDecode(repRaw) as List).map((e) => ReportArchiveItem.fromJson(e)).toList();
                } catch (_) {}
              }
              notifyListeners();
            }

            Future<void> save() async {
              final p = await SharedPreferences.getInstance();
              await p.setBool('itq_dark', themeMode == ThemeMode.dark);
              await p.setDouble('itq_font', fontSize);
              await p.setBool('itq_tajweed', tajweedColors);
              await p.setBool('itq_coach', liveTajweedCoach);
              await p.setBool('itq_vib', vibrateOnError);
              await p.setString('itq_name', studentName);
              await p.setString('itq_fb_url', firebaseUrl);
              await p.setString('itq_room', activeRoomCode);
              await p.setStringList('itq_mastered', masteredSurahs.map((e) => '$e').toList());
              await p.setString('itq_recs', jsonEncode(recordings.take(40).map((e) => e.toJson()).toList()));
              await p.setString('itq_reps', jsonEncode(reports.take(50).map((e) => e.toJson()).toList()));
              notifyListeners();
            }
          }

