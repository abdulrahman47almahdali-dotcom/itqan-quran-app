          // ============================================================================
          // ITQAN VOICE RECITATION & LIVE TAJWEED COACH STUDIO (ZERO DEMO BUTTONS)
          // ============================================================================
          class ItqanCoachScreen extends StatefulWidget {
            final SurahModel surah;
            final ItqanState state;
            final FlutterTts tts;
            final String? challengeRoomCode;
            const ItqanCoachScreen({super.key, required this.surah, required this.state, required this.tts, this.challengeRoomCode});
            @override
            State<ItqanCoachScreen> createState() => _ItqanCoachScreenState();
          }

          class _ItqanCoachScreenState extends State<ItqanCoachScreen> with SingleTickerProviderStateMixin {
            final stt.SpeechToText _speech = stt.SpeechToText();
            final ScrollController _scroll = ScrollController();
            late AnimationController _orbCtrl;
            bool _sttReady = false;
            String _localeId = 'ar_SA';
            bool _listening = false;
            bool _paused = false;
            bool _peek = false;
            int _ayahIdx = 0;
            int _wordIdx = 0;
            bool _hintFirst = false;
            int _seconds = 0;
            double _level = 0.0;
            String _liveHeard = '';
            int _processedCount = 0;
            Timer? _clock;
            final Set<int> _doneAyahs = {};
            final List<ReciteMistake> _mistakes = [];

            @override
            void initState() {
              super.initState();
              _orbCtrl = AnimationController(vsync: this, duration: const Duration(seconds: 4));
              _initStt();
              _clock = Timer.periodic(const Duration(seconds: 1), (_) {
                if (_listening && !_paused && mounted) setState(() => _seconds++);
              });
            }

            Future<void> _initStt() async {
              try {
                final ok = await _speech.initialize(
                  onStatus: (s) {
                    if (!mounted) return;
                    if ((s == 'done' || s == 'notListening') && _listening && !_paused) {
                      Future.delayed(const Duration(milliseconds: 220), () {
                        if (_listening && !_paused && mounted) _listenLoop();
                      });
                    }
                  },
                  onError: (_) {
                    if (!mounted) return;
                    if (_listening && !_paused) {
                      Future.delayed(const Duration(milliseconds: 400), () {
                        if (_listening && !_paused && mounted) _listenLoop();
                      });
                    }
                  },
                );
                if (ok) {
                  final locs = await _speech.locales();
                  final ar = locs.where((l) => l.localeId.toLowerCase().startsWith('ar')).toList();
                  if (ar.isNotEmpty) {
                    final sa = ar.where((l) => l.localeId.toLowerCase().contains('sa')).toList();
                    _localeId = sa.isNotEmpty ? sa.first.localeId : ar.first.localeId;
                  }
                }
                if (mounted) setState(() => _sttReady = ok);
              } catch (_) {}
            }

            Future<void> _listenLoop() async {
              if (!_sttReady) {
                await _initStt();
                if (!_sttReady) return;
              }
              _processedCount = 0;
              try {
                await _speech.listen(
                  localeId: _localeId,
                  listenFor: const Duration(seconds: 60),
                  pauseFor: const Duration(seconds: 8),
                  listenOptions: stt.SpeechListenOptions(partialResults: true, listenMode: stt.ListenMode.dictation, cancelOnError: false),
                  onSoundLevelChange: (lvl) {
                    if (mounted) setState(() => _level = lvl.clamp(0.0, 12.0));
                  },
                  onResult: (r) {
                    if (!mounted || !_listening || _paused) return;
                    final txt = r.recognizedWords.trim();
                    if (txt.isEmpty) return;
                    final words = txt.split(RegExp(r'\s+')).where((w) => w.isNotEmpty).toList();
                    setState(() => _liveHeard = words.length > 4 ? words.sublist(words.length - 4).join(' ') : txt);
                    final start = min(_processedCount, words.length);
                    for (int i = start; i < words.length; i++) {
                      _matchWord(words[i]);
                    }
                    _processedCount = words.length;
                  },
                );
              } catch (_) {}
            }

            void _matchWord(String spoken) {
              if (_ayahIdx >= widget.surah.ayahs.length) return;
              final ayah = widget.surah.ayahs[_ayahIdx];
              final targets = ayah.text.split(RegExp(r'\s+')).where((w) => w.isNotEmpty).toList();
              if (_wordIdx >= targets.length) return;

              if (widget.surah.num == 1 && _ayahIdx == 0 && _wordIdx == 0 && widget.surah.ayahs.length > 1) {
                final w2 = widget.surah.ayahs[1].text.split(RegExp(r'\s+')).where((w) => w.isNotEmpty).toList();
                if (w2.isNotEmpty && QuranMatcher.wordsMatch(w2[0], spoken)) {
                  setState(() {
                    _doneAyahs.add(0);
                    _ayahIdx = 1;
                    _wordIdx = 1;
                    _hintFirst = false;
                  });
                  return;
                }
              }

              if (QuranMatcher.wordsMatch(targets[_wordIdx], spoken)) {
                _advance(targets.length);
                return;
              }
              if (_wordIdx + 1 < targets.length && QuranMatcher.wordsMatch(targets[_wordIdx + 1], spoken)) {
                if (QuranMatcher.normalize(targets[_wordIdx]).length >= 3) {
                  if (widget.state.vibrateOnError) HapticFeedback.lightImpact();
                  _mistakes.add(ReciteMistake(ayahNum: ayah.num, expectedWord: targets[_wordIdx], heardWord: spoken));
                }
                _advance(targets.length);
                if (_ayahIdx < widget.surah.ayahs.length && _wordIdx < targets.length) _advance(targets.length);
              }
            }

            void _advance(int totalW) {
              setState(() {
                _wordIdx++;
                _hintFirst = false;
                if (_wordIdx >= totalW) {
                  _doneAyahs.add(_ayahIdx);
                  if (_ayahIdx + 1 < widget.surah.ayahs.length) {
                    _ayahIdx++;
                    _wordIdx = 0;
                  } else {
                    _finish();
                  }
                }
              });
              Future.delayed(const Duration(milliseconds: 120), () {
                if (_scroll.hasClients) _scroll.animateTo(_scroll.position.maxScrollExtent, duration: const Duration(milliseconds: 280), curve: Curves.easeOut);
              });
            }

            Future<void> _toggleMic() async {
              if (_listening) {
                await _finish();
              } else {
                setState(() {
                  _listening = true;
                  _paused = false;
                });
                _orbCtrl.repeat();
                await _listenLoop();
              }
            }

            Future<void> _finish() async {
              _listening = false;
              _paused = false;
              _orbCtrl.stop();
              await _speech.stop();
              if (!mounted) return;

              final recited = widget.surah.ayahs.sublist(0, min(widget.surah.ayahs.length, _ayahIdx + 1));
              final allTajweed = <TajweedNote>[];
              for (final a in recited) {
                allTajweed.addAll(TajweedAnalyzer.analyzeAyah(a.text));
              }
              final score = max(35, 100 - (_mistakes.length * 10)).clamp(0, 100);
              if (score >= 85 && _doneAyahs.length == widget.surah.ayahs.length) {
                widget.state.masteredSurahs.add(widget.surah.num);
              }
              widget.state.reports.insert(
                0,
                ReportArchiveItem(
                  surahName: widget.surah.name,
                  score: score,
                  errors: _mistakes.length,
                  tajweedCount: allTajweed.length,
                  dateStr: DateTime.now().toIso8601String().substring(0, 10),
                ),
              );
              await widget.state.save();

              if (widget.challengeRoomCode != null && widget.state.firebaseUrl.isNotEmpty) {
                await FirebaseRoomService.joinOrUpdateMember(
                  dbUrl: widget.state.firebaseUrl,
                  roomCode: widget.challengeRoomCode!,
                  memberId: widget.state.memberId,
                  name: widget.state.studentName.isEmpty ? 'متسابق' : widget.state.studentName,
                  done: true,
                  score: score,
                  tajweed: allTajweed.length,
                );
              }

              if (!mounted) return;
              Navigator.pushReplacement(
                context,
                MaterialPageRoute(
                  builder: (_) => ItqanVisualReportScreen(
                    surah: widget.surah,
                    ayahCount: recited.length,
                    durationSec: _seconds,
                    score: score,
                    mistakes: _mistakes,
                    tajweedNotes: allTajweed,
                    state: widget.state,
                  ),
                ),
              );
            }

            @override
            void dispose() {
              _clock?.cancel();
              _orbCtrl.dispose();
              _scroll.dispose();
              _speech.stop();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final currentAyah = widget.surah.ayahs[_ayahIdx];
              final liveTaj = widget.state.liveTajweedCoach ? TajweedAnalyzer.analyzeAyah(currentAyah.text) : <TajweedNote>[];

              return Scaffold(
                appBar: AppBar(
                  title: Text(widget.surah.name, style: const TextStyle(fontFamily: 'Cairo', fontWeight: FontWeight.bold)),
                  actions: [
                    IconButton(icon: const Icon(Icons.check_rounded, color: kGoldLight), onPressed: _finish),
                  ],
                ),
                body: Column(
                  children: [
                    // Live Tajweed Coaching Banner
                    if (liveTaj.isNotEmpty)
                      Container(
                        width: double.infinity,
                        padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 8),
                        color: kEmeraldSoft,
                        child: SingleChildScrollView(
                          scrollDirection: Axis.horizontal,
                          child: Row(
                            children: [
                              const Icon(Icons.auto_awesome_rounded, size: 16, color: kGold),
                              const SizedBox(width: 6),
                              const Text('أحكام التجويد في هذه الآية: ', style: TextStyle(fontFamily: 'Cairo', fontWeight: FontWeight.bold, fontSize: 11, color: kEmerald)),
                              for (final n in liveTaj.take(4))
                                Container(
                                  margin: const EdgeInsets.only(left: 6),
                                  padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 2),
                                  decoration: BoxDecoration(color: n.color.withValues(alpha: 0.14), borderRadius: BorderRadius.circular(10)),
                                  child: Text('${n.rule}: ${n.word}', style: TextStyle(fontFamily: 'Cairo', fontSize: 11, color: n.color, fontWeight: FontWeight.bold)),
                                ),
                            ],
                          ),
                        ),
                      ),

                    Expanded(
                      child: ListView.builder(
                        controller: _scroll,
                        padding: const EdgeInsets.all(18),
                        itemCount: min(widget.surah.ayahs.length, _ayahIdx + 2),
                        itemBuilder: (_, idx) {
                          final a = widget.surah.ayahs[idx];
                          final words = a.text.split(RegExp(r'\s+')).where((w) => w.isNotEmpty).toList();
                          final done = _doneAyahs.contains(idx);
                          final current = idx == _ayahIdx;

                          if (done || (_peek && current)) {
                            return Padding(
                              padding: const EdgeInsets.only(bottom: 14),
                              child: Text(
                                '${a.text} ﴿${QuranMatcher.toArabicDigits(a.num)}﴾',
                                textAlign: TextAlign.center,
                                style: TextStyle(fontFamily: 'AmiriQuran', fontSize: widget.state.fontSize, height: 2.0),
                              ),
                            );
                          }
                          if (current) {
                            return Container(
                              margin: const EdgeInsets.only(bottom: 14),
                              padding: const EdgeInsets.all(14),
                              decoration: BoxDecoration(
                                color: Theme.of(context).brightness == Brightness.dark ? const Color(0xFF10211B) : Colors.white,
                                borderRadius: BorderRadius.circular(18),
                                border: Border.all(color: kGold),
                              ),
                              child: Wrap(
                                alignment: WrapAlignment.center,
                                spacing: 8,
                                runSpacing: 10,
                                children: [
                                  for (int w = 0; w < words.length; w++)
                                    if (w < _wordIdx)
                                      Text(words[w], style: TextStyle(fontFamily: 'AmiriQuran', fontSize: widget.state.fontSize, height: 1.7))
                                    else if (w == _wordIdx && _hintFirst)
                                      Text(QuranMatcher.firstLetterHint(words[w]), style: TextStyle(fontFamily: 'AmiriQuran', fontSize: widget.state.fontSize, color: kGold))
                                    else
                                      Container(
                                        width: max(36.0, min(86.0, words[w].length * 7.5)),
                                        height: 11,
                                        margin: const EdgeInsets.only(top: 18),
                                        decoration: BoxDecoration(color: kBorder, borderRadius: BorderRadius.circular(6)),
                                      ),
                                  Text('﴿${QuranMatcher.toArabicDigits(a.num)}﴾', style: const TextStyle(fontFamily: 'AmiriQuran', fontSize: 22, color: kGold)),
                                ],
                              ),
                            );
                          }
                          return Center(child: Text('﴿${QuranMatcher.toArabicDigits(a.num)}﴾', style: const TextStyle(fontFamily: 'AmiriQuran', fontSize: 22, color: kMuted)));
                        },
                      ),
                    ),

                    // Bottom Dock
                    Container(
                      padding: const EdgeInsets.fromLTRB(16, 10, 16, 16),
                      decoration: BoxDecoration(
                        color: Theme.of(context).brightness == Brightness.dark ? kEmeraldDeep : Colors.white,
                        borderRadius: const BorderRadius.vertical(top: Radius.circular(26)),
                        boxShadow: [BoxShadow(color: Colors.black.withValues(alpha: 0.08), blurRadius: 18)],
                      ),
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          Text(
                            _liveHeard.isNotEmpty ? 'سمعت: «$_liveHeard»' : 'المس الدائرة الذهبية وابدأ التسميع بصوتك',
                            maxLines: 1,
                            overflow: TextOverflow.ellipsis,
                            style: const TextStyle(fontSize: 11, color: kMuted),
                          ),
                          const SizedBox(height: 10),
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceAround,
                            children: [
                              TextButton(
                                onPressed: () => setState(() => _peek = !_peek),
                                child: Text(_peek ? 'أخفِ الآية' : 'أظهر الآية', style: const TextStyle(fontFamily: 'Cairo', fontWeight: FontWeight.bold, color: kEmerald)),
                              ),
                              GestureDetector(
                                onTap: _toggleMic,
                                child: RotationTransition(
