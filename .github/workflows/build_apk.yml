                                      boxShadow: [BoxShadow(color: kEmerald.withValues(alpha: 0.35), blurRadius: 16)],
                                    ),
                                    child: Icon(_listening ? Icons.stop_rounded : Icons.mic_rounded, color: Colors.white, size: 32),
                                  ),
                                ),
                              ),
                              TextButton(
                                onPressed: () => setState(() => _hintFirst = true),
                                child: const Text('أول حرف', style: TextStyle(fontFamily: 'Cairo', fontWeight: FontWeight.bold, color: kGold)),
                              ),
                            ],
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

