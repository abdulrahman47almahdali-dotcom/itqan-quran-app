          // ============================================================================
          // VOICE STUDIO + MUTASHABIHAT STUDIO + FAJR MODE
          // ============================================================================
          class VoiceStudioScreen extends StatefulWidget {
            final ItqanState state;
            const VoiceStudioScreen({super.key, required this.state});
            @override
            State<VoiceStudioScreen> createState() => _VoiceStudioScreenState();
          }

          class _VoiceStudioScreenState extends State<VoiceStudioScreen> {
            final AudioRecorder _rec = AudioRecorder();
            final AudioPlayer _player = AudioPlayer();
            bool _recording = false;
            String? _playing;

            Future<void> _toggle() async {
              if (_recording) {
                final path = await _rec.stop();
                setState(() => _recording = false);
                if (path != null) {
                  final now = DateTime.now();
                  widget.state.recordings.insert(
                    0,
                    VoiceNoteItem(
                      title: 'تلاوة ${now.hour}:${now.minute.toString().padLeft(2, '0')}',
                      path: path,
                      dateStr: now.toIso8601String().substring(0, 10),
                    ),
                  );
                  widget.state.save();
                }
              } else if (await _rec.hasPermission()) {
                final dir = await getApplicationDocumentsDirectory();
                final path = '${dir.path}/itqan_${DateTime.now().millisecondsSinceEpoch}.m4a';
                await _rec.start(const RecordConfig(encoder: AudioEncoder.aacLc), path: path);
                setState(() => _recording = true);
              }
            }

            @override
            void dispose() {
              _rec.dispose();
              _player.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return AnimatedBuilder(
                animation: widget.state,
                builder: (_, __) => Scaffold(
                  appBar: AppBar(title: const Text('تسجيلاتي الصوتية', style: TextStyle(fontFamily: 'Cairo', fontWeight: FontWeight.bold))),
                  body: Column(
                    children: [
                      Padding(
                        padding: const EdgeInsets.all(16),
                        child: SizedBox(
                          width: double.infinity,
                          child: ElevatedButton.icon(
                            style: ElevatedButton.styleFrom(backgroundColor: _recording ? kDanger : kEmerald, foregroundColor: Colors.white, padding: const EdgeInsets.symmetric(vertical: 14)),
                            icon: Icon(_recording ? Icons.stop_rounded : Icons.fiber_manual_record_rounded),
                            label: Text(_recording ? 'إيقاف وحفظ التسجيل' : 'سجّل تلاوتك الآن', style: const TextStyle(fontFamily: 'Cairo', fontWeight: FontWeight.bold)),
                            onPressed: _toggle,
                          ),
                        ),
                      ),
                      Expanded(
                        child: ListView.builder(
                          padding: const EdgeInsets.symmetric(horizontal: 16),
                          itemCount: widget.state.recordings.length,
                          itemBuilder: (_, i) {
                            final v = widget.state.recordings[i];
                            return Card(
                              child: ListTile(
                                leading: IconButton(
                                  icon: Icon(_playing == v.path ? Icons.stop_circle_rounded : Icons.play_circle_fill_rounded, color: kEmerald, size: 32),
                                  onPressed: () async {
                                    if (_playing == v.path) {
                                      await _player.stop();
                                      setState(() => _playing = null);
                                    } else {
                                      await _player.play(DeviceFileSource(v.path));
                                      setState(() => _playing = v.path);
                                    }
                                  },
                                ),
                                title: Text(v.title, style: const TextStyle(fontFamily: 'Cairo', fontWeight: FontWeight.bold)),
                                subtitle: Text(v.dateStr),
                                trailing: IconButton(
                                  icon: const Icon(Icons.share_rounded, color: kGold),
                                  onPressed: () => Share.shareXFiles([XFile(v.path)], text: 'تسجيل تسميع من تطبيق إتقان — ITQAN'),
                                ),
                              ),
                            );
                          },
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

