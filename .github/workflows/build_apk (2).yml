                    const SizedBox(height: 16),

                    if (widget.mistakes.isNotEmpty) ...[
                      Text('أخطاء الحفظ (${widget.mistakes.length})', style: const TextStyle(fontFamily: 'Cairo', fontWeight: FontWeight.bold, fontSize: 15, color: kDanger)),
                      const SizedBox(height: 8),
                      for (final m in widget.mistakes)
                        Card(
                          color: kDangerBg,
