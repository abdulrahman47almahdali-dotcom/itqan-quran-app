          // ============================================================================
          // TAB 3: LIVE 5-PERSON FIREBASE CHALLENGE ROOM (VISIBLE LINK BOX + DEEP LINK)
          // ============================================================================
          class FirebaseChallengeTab extends StatefulWidget {
            final List<SurahModel> surahs;
            final ItqanState state;
            const FirebaseChallengeTab({super.key, required this.surahs, required this.state});
            @override
            State<FirebaseChallengeTab> createState() => _FirebaseChallengeTabState();
          }

          class _FirebaseChallengeTabState extends State<FirebaseChallengeTab> {
            final _joinCtrl = TextEditingController();
            int _pickedSurahIdx = 66;
            Map<String, dynamic>? _room;
            bool _busy = false;
            String? _statusMsg;
            bool _isError = false;
            Timer? _poller;

            @override
            void initState() {
              super.initState();
              if (widget.state.pendingDeepLinkRoom.isNotEmpty) {
                _joinCtrl.text = widget.state.pendingDeepLinkRoom;
                widget.state.pendingDeepLinkRoom = '';
                WidgetsBinding.instance.addPostFrameCallback((_) => _joinRoom());
              }
              _poller = Timer.periodic(const Duration(seconds: 4), (_) async {
                if (_room != null && mounted) {
                  final fresh = await FirebaseRoomService.fetchRoom(widget.state.firebaseUrl, _room!['code']);
                  if (mounted && fresh != null) setState(() => _room = fresh);
                }
              });
            }

            @override
            void dispose() {
              _poller?.cancel();
              _joinCtrl.dispose();
              super.dispose();
            }

            Future<void> _testFb() async {
              setState(() { _busy = true; _statusMsg = null; });
              final res = await FirebaseRoomService.testConnection(widget.state.firebaseUrl);
              if (mounted) setState(() { _busy = false; _statusMsg = res; _isError = !res.contains('✓'); });
            }

            Future<void> _createRoom() async {
              setState(() { _busy = true; _statusMsg = null; });
              try {
                final code = 'ITQAN-${1000 + Random().nextInt(8999)}';
                final s = widget.surahs[_pickedSurahIdx];
                final host = widget.state.studentName.isEmpty ? 'منشئ الغرفة' : widget.state.studentName;
                final err = await FirebaseRoomService.createRoom(
                  dbUrl: widget.state.firebaseUrl,
                  roomCode: code,
                  surahNum: s.num,
                  surahName: s.name,
                  hostId: widget.state.memberId,
                  hostName: host,
                );
                if (err != null) {
                  if (mounted) setState(() { _statusMsg = err; _isError = true; });
                } else {
                  final data = await FirebaseRoomService.fetchRoom(widget.state.firebaseUrl, code);
                  if (mounted) setState(() => _room = data);
                }
              } finally {
                if (mounted) setState(() => _busy = false);
              }
            }

            Future<void> _joinRoom() async {
              final raw = _joinCtrl.text.trim().toUpperCase();
              final code = raw.contains('ITQAN-') ? raw.substring(raw.indexOf('ITQAN-')).split(RegExp(r'[\s/?#]')).first : raw;
              if (code.isEmpty) return;
              setState(() { _busy = true; _statusMsg = null; });
              try {
                final err = await FirebaseRoomService.joinOrUpdateMember(
                  dbUrl: widget.state.firebaseUrl,
                  roomCode: code,
                  memberId: widget.state.memberId,
                  name: widget.state.studentName.isEmpty ? 'متسابق' : widget.state.studentName,
                  done: false,
                  score: 0,
                );
                if (err != null) {
                  if (mounted) setState(() { _statusMsg = err; _isError = true; });
                } else {
                  final updated = await FirebaseRoomService.fetchRoom(widget.state.firebaseUrl, code);
                  if (mounted) setState(() => _room = updated);
                }
              } finally {
                if (mounted) setState(() => _busy = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              final membersMap = (_room?['members'] as Map<String, dynamic>?) ?? {};
              final members = membersMap.values.map((e) => Map<String, dynamic>.from(e as Map)).toList()
                ..sort((a, b) => ((b['score'] ?? 0) as int).compareTo((a['score'] ?? 0) as int));

              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  if (_statusMsg != null)
                    Container(
                      margin: const EdgeInsets.only(bottom: 12),
                      padding: const EdgeInsets.all(12),
                      decoration: BoxDecoration(
                        color: _isError ? kDangerBg : kEmeraldSoft,
                        borderRadius: BorderRadius.circular(14),
                        border: Border.all(color: _isError ? kDanger : kEmerald),
                      ),
                      child: Text(_statusMsg!, style: TextStyle(color: _isError ? kDanger : kEmerald, fontFamily: 'Cairo', fontSize: 12, fontWeight: FontWeight.bold)),
                    ),

                  if (_room == null) ...[
                    Container(
                      padding: const EdgeInsets.all(18),
                      decoration: BoxDecoration(gradient: const LinearGradient(colors: [kEmerald, kEmeraldDeep]), borderRadius: BorderRadius.circular(22), border: Border.all(color: kGold)),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceBetween,
                            children: [
                              const Text('غرفة التحدي (٥ أشخاص)', style: TextStyle(fontFamily: 'Cairo', fontWeight: FontWeight.bold, fontSize: 18, color: Colors.white)),
                              TextButton(onPressed: _busy ? null : _testFb, child: const Text('فحص الاتصال', style: TextStyle(color: kGoldLight, fontSize: 12))),
                            ],
                          ),
                          const Text('تعمل عبر الإنترنت بين ٥ جوالات — بعد الإنشاء يظهر لك رابط الدعوة مباشرة.', style: TextStyle(color: Colors.white70, fontSize: 12)),
                          const SizedBox(height: 10),
                          DropdownButtonFormField<int>(
