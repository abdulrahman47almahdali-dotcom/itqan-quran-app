          // ============================================================================
          // INSTANT ON-DEVICE OFFLINE QURAN AI RECITATION STUDIO (WORD-BY-WORD!)
          // Uses sherpa_onnx + Tarteel Whisper Quran INT8 locally — ZERO INTERNET, ZERO BEEP!
          // ============================================================================
          class OfflineAiReciteStudioScreen extends StatefulWidget {
            final SurahModel surah;
            final ItqanState state;
            final String? challengeRoomCode;
            const OfflineAiReciteStudioScreen({super.key, required this.surah, required this.state, this.challengeRoomCode});
            @override
            State<OfflineAiReciteStudioScreen> createState() => _OfflineAiReciteStudioScreenState();
          }

          class _OfflineAiReciteStudioScreenState extends State<OfflineAiReciteStudioScreen> with SingleTickerProviderStateMixin {
            final AudioRecorder _rec = AudioRecorder();
            final ScrollController _scroll = ScrollController();
            late AnimationController _orbCtrl;
            StreamSubscription<Uint8List>? _pcmSub;
            final BytesBuilder _fullPcm = BytesBuilder(copy: false);
            final List<int> _windowPcm = [];

            bool _modelLoading = true;
            bool _recording = false;
            bool _decodingNow = false;
            bool _peek = false;
            bool _hintFirst = false;
            int _ayahIdx = 0;
            int _wordIdx = 0;
            int _seconds = 0;
            double _amp = 0.15;
            String _liveHeard = '';
            String _statusText = 'جارٍ تجهيز محرك الذكاء الاصطناعي القرآني المحلي...';
            Timer? _clock;
            Timer? _inferTimer;
            final Set<int> _doneAyahs = {};
            final List<ReciteMistake> _mistakes = [];

            @override
            void initState() {
              super.initState();
              _orbCtrl = AnimationController(vsync: this, duration: const Duration(seconds: 4));
              _prepareModel();
            }

            Future<void> _prepareModel() async {
              final ok = await OfflineQuranAiEngine.ensureInitialized();
              if (!mounted) return;
              setState(() {
                _modelLoading = false;
                _statusText = ok
                    ? 'المحرك القرآني المحلي جاهز ✓ المس الدائرة وابدأ التسميع بلا إنترنت'
                    : (OfflineQuranAiEngine.lastError ?? 'تعذّر تحميل النموذج');
              });
            }

            @override
            void dispose() {
              _clock?.cancel();
              _inferTimer?.cancel();
              _pcmSub?.cancel();
              _orbCtrl.dispose();
              _scroll.dispose();
              _rec.dispose();
              super.dispose();
            }

            Future<void> _toggleRec() async {
              if (_modelLoading) return;
              if (!OfflineQuranAiEngine.isReady) {
                await _prepareModel();
                if (!OfflineQuranAiEngine.isReady) return;
              }

              if (!_recording) {
                if (!await _rec.hasPermission()) {
                  if (mounted) ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('يرجى السماح بإذن الميكروفون')));
                  return;
                }
                _fullPcm.clear();
                _windowPcm.clear();
                final stream = await _rec.startStream(const RecordConfig(encoder: AudioEncoder.pcm16bits, sampleRate: 16000, numChannels: 1));
                _pcmSub = stream.listen((data) {
                  _fullPcm.add(data);
                  _windowPcm.addAll(data);
                  // Keep rolling 3.2-second window (16000 samples/s * 2 bytes * 3.2s = 102400 bytes)
                  if (_windowPcm.length > 102400) {
                    _windowPcm.removeRange(0, _windowPcm.length - 102400);
                  }
                  if (data.length >= 2) {
                    final sample = (data[0] | (data[1] << 8)).toSigned(16).abs();
                    final lvl = (sample / 18000.0).clamp(0.1, 1.0);
                    if (mounted) setState(() => _amp = lvl);
                  }
                });

                setState(() {
                  _recording = true;
                  _seconds = 0;
                  _statusText = 'أستمع لك محليًا بدون إنترنت...';
                });
                _orbCtrl.repeat();
                _clock = Timer.periodic(const Duration(seconds: 1), (_) {
                  if (mounted) setState(() => _seconds++);
                });
                // Run fast on-device inference every 1.1 seconds — instant word-by-word reveal!
                _inferTimer = Timer.periodic(const Duration(milliseconds: 1100), (_) => _runLocalInference());
              } else {
                await _finishSession();
              }
            }

            Future<void> _runLocalInference() async {
              if (!_recording || _decodingNow || _windowPcm.length < 16000) return;
              _decodingNow = true;
              try {
                final bytes = Uint8List.fromList(_windowPcm);
                final text = OfflineQuranAiEngine.transcribePcm16(bytes);
                if (mounted && text.isNotEmpty) {
                  setState(() => _liveHeard = text);
                  final spokenWords = text.split(RegExp(r'\s+')).where((w) => w.isNotEmpty).toList();
                  for (final w in spokenWords) {
                    _matchSpokenWord(w);
                  }
                }
              } finally {
                _decodingNow = false;
              }
            }

            void _matchSpokenWord(String spoken) {
              if (_ayahIdx >= widget.surah.ayahs.length) return;
              final ayah = widget.surah.ayahs[_ayahIdx];
              final targets = ayah.text.split(RegExp(r'\s+')).where((w) => w.isNotEmpty).toList();
              if (_wordIdx >= targets.length) return;

              // Smart Al-Fatihah Basmalah skip if user starts directly with "الحمد"
              if (widget.surah.num == 1 && _ayahIdx == 0 && _wordIdx == 0 && widget.surah.ayahs.length > 1) {
                final w2 = widget.surah.ayahs[1].text.split(RegExp(r'\s+')).where((w) => w.isNotEmpty).toList();
                if (w2.isNotEmpty && QuranEngine.wordsMatch(w2[0], spoken)) {
                  setState(() {
                    _doneAyahs.add(0);
                    _ayahIdx = 1;
                    _wordIdx = 1;
                    _hintFirst = false;
                  });
                  return;
                }
              }

              if (QuranEngine.wordsMatch(targets[_wordIdx], spoken)) {
                _advance(targets.length);
                return;
              }
              if (_wordIdx + 1 < targets.length && QuranEngine.wordsMatch(targets[_wordIdx + 1], spoken)) {
                if (QuranEngine.normalize(targets[_wordIdx]).length >= 3) {
                  HapticFeedback.lightImpact();
                  if (!_mistakes.any((m) => m.ayahNum == ayah.num && m.expected == targets[_wordIdx])) {
                    _mistakes.add(ReciteMistake(ayahNum: ayah.num, expected: targets[_wordIdx], heard: spoken));
                  }
                }
                _advance(targets.length);
                if (_ayahIdx < widget.surah.ayahs.length && _wordIdx < targets.length) _advance(targets.length);
              }
            }

            void _advance(int totalW) {
              setState(() {
                _wordIdx++;
                _hintFirst = false;
                if (_wordIdx >= totalW) {
                  _doneAyahs.add(_ayahIdx);
                  _windowPcm.clear(); // clear window cleanly on ayah transition
                  if (_ayahIdx + 1 < widget.surah.ayahs.length) {
                    _ayahIdx++;
                    _wordIdx = 0;
                  } else {
                    _finishSession();
                  }
                }
              });
              Future.delayed(const Duration(milliseconds: 100), () {
                if (_scroll.hasClients) _scroll.animateTo(_scroll.position.maxScrollExtent, duration: const Duration(milliseconds: 240), curve: Curves.easeOut);
              });
            }

            Future<void> _finishSession() async {
              _clock?.cancel();
              _inferTimer?.cancel();
              await _pcmSub?.cancel();
              _pcmSub = null;
              if (_recording) {
                await _rec.stop();
                _orbCtrl.stop();
                setState(() => _recording = false);
              }

              final rawPcm = _fullPcm.takeBytes();
              if (rawPcm.length >= 3200) {
                final wavBytes = OfflineQuranAiEngine.wrapPcmToWav(rawPcm, sampleRate: 16000);
                final dir = await getApplicationDocumentsDirectory();
                final wavPath = '${dir.path}/itqan_${widget.surah.num}_${DateTime.now().millisecondsSinceEpoch}.wav';
                await File(wavPath).writeAsBytes(wavBytes);
                final now = DateTime.now();
                widget.state.recordings.insert(
                  0,
                  VoiceNoteItem(
                    title: '${widget.surah.name} • ${now.hour}:${now.minute.toString().padLeft(2, '0')}',
                    path: wavPath,
                    dateStr: now.toIso8601String().substring(0, 10),
                  ),
                );
                await widget.state.save();
              }

              final heardAnything = _doneAyahs.isNotEmpty || _wordIdx > 0;
              final score = heardAnything ? max(35, 100 - (_mistakes.length * 10)).clamp(0, 100) : 0;
              final recitedCount = _doneAyahs.length + (_wordIdx > 0 ? 1 : 0);
              final recitedAyahs = widget.surah.ayahs.take(max(1, recitedCount)).toList();
              final tajNotes = <TajweedRuleNote>[];
              for (final a in recitedAyahs) {
                tajNotes.addAll(QuranEngine.analyzeAyah(a.text));
              }

              if (heardAnything && score >= 85 && _doneAyahs.length == widget.surah.ayahs.length) {
                widget.state.masteredSurahs.add(widget.surah.num);
                await widget.state.save();
              }
              if (widget.challengeRoomCode != null && heardAnything) {
                await FirebaseRoomService.joinOrUpdateMember(
                  dbUrl: widget.state.firebaseUrl,
                  roomCode: widget.challengeRoomCode!,
                  memberId: widget.state.memberId,
                  name: widget.state.studentName.isEmpty ? 'متسابق' : widget.state.studentName,
                  done: true,
                  score: score,
                );
              }

              if (!mounted) return;
              Navigator.pushReplacement(
                context,
                MaterialPageRoute(
                  builder: (_) => ItqanVisualReportScreen(
                    surah: widget.surah,
                    heardAnything: heardAnything,
                    recitedCount: recitedCount,
                    durationSec: _seconds,
                    score: score,
                    mistakes: _mistakes,
                    tajweedNotes: tajNotes,
                    state: widget.state,
                  ),
                ),
              );
            }

            String _fmt(int s) => '${s ~/ 60}:${(s % 60).toString().padLeft(2, '0')}';

            @override
            Widget build(BuildContext context) {
              final currentAyah = widget.surah.ayahs[_ayahIdx];
              final liveTaj = QuranEngine.analyzeAyah(currentAyah.text);

              return Scaffold(
                appBar: AppBar(
                  title: Text(widget.surah.name, style: const TextStyle(fontFamily: 'Cairo', fontWeight: FontWeight.bold)),
                  actions: [
                    IconButton(icon: const Icon(Icons.check_rounded, color: kGoldLight), onPressed: _finishSession),
                  ],
                ),
                body: Column(
                  children: [
                    if (liveTaj.isNotEmpty)
                      Container(
                        width: double.infinity,
                        padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 7),
                        color: kEmeraldSoft,
                        child: SingleChildScrollView(
                          scrollDirection: Axis.horizontal,
                          child: Row(
                            children: [
                              const Icon(Icons.auto_awesome_rounded, size: 15, color: kGold),
                              const SizedBox(width: 6),
                              const Text('أحكام التجويد هنا: ', style: TextStyle(fontFamily: 'Cairo', fontWeight: FontWeight.bold, fontSize: 11, color: kEmerald)),
                              for (final n in liveTaj.take(4))
                                Container(
                                  margin: const EdgeInsets.only(left: 6),
                                  padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 2),
                                  decoration: BoxDecoration(color: n.color.withValues(alpha: 0.14), borderRadius: BorderRadius.circular(10)),
                                  child: Text('${n.rule}: ${n.word}', style: TextStyle(fontFamily: 'Cairo', fontSize: 11, color: n.color, fontWeight: FontWeight.bold)),
                                ),
                            ],
                          ),
                        ),
                      ),

                    Expanded(
                      child: ListView.builder(
                        controller: _scroll,
                        padding: const EdgeInsets.all(18),
                        itemCount: min(widget.surah.ayahs.length, _ayahIdx + 2),
                        itemBuilder: (_, idx) {
                          final a = widget.surah.ayahs[idx];
                          final words = a.text.split(RegExp(r'\s+')).where((w) => w.isNotEmpty).toList();
                          final done = _doneAyahs.contains(idx);
                          final current = idx == _ayahIdx;

                          if (done || (_peek && current)) {
                            return Padding(
                              padding: const EdgeInsets.only(bottom: 14),
                              child: Text(
                                '${a.text} ﴿${QuranEngine.toArabicDigits(a.num)}﴾',
                                textAlign: TextAlign.center,
                                style: TextStyle(fontFamily: 'AmiriQuran', fontSize: widget.state.fontSize, height: 2.0),
                              ),
                            );
                          }
                          if (current) {
                            return Container(
                              margin: const EdgeInsets.only(bottom: 14),
                              padding: const EdgeInsets.all(14),
                              decoration: BoxDecoration(
                                color: Theme.of(context).brightness == Brightness.dark ? const Color(0xFF10211B) : Colors.white,
                                borderRadius: BorderRadius.circular(18),
                                border: Border.all(color: kGold),
                              ),
                              child: Wrap(
                                alignment: WrapAlignment.center,
                                spacing: 8,
                                runSpacing: 10,
                                children: [
                                  for (int w = 0; w < words.length; w++)
                                    if (w < _wordIdx)
                                      Text(words[w], style: TextStyle(fontFamily: 'AmiriQuran', fontSize: widget.state.fontSize, height: 1.7))
                                    else if (w == _wordIdx && _hintFirst)
                                      Text(QuranEngine.firstLetterHint(words[w]), style: TextStyle(fontFamily: 'AmiriQuran', fontSize: widget.state.fontSize, color: kGold))
                                    else
                                      Container(
                                        width: max(36.0, min(86.0, words[w].length * 7.5)),
                                        height: 11,
                                        margin: const EdgeInsets.only(top: 18),
                                        decoration: BoxDecoration(color: kBorder, borderRadius: BorderRadius.circular(6)),
                                      ),
                                  Text('﴿${QuranEngine.toArabicDigits(a.num)}﴾', style: const TextStyle(fontFamily: 'AmiriQuran', fontSize: 22, color: kGold)),
                                ],
                              ),
                            );
                          }
                          return Center(child: Text('﴿${QuranEngine.toArabicDigits(a.num)}﴾', style: const TextStyle(fontFamily: 'AmiriQuran', fontSize: 22, color: kMuted)));
                        },
                      ),
                    ),

                    Container(
                      padding: const EdgeInsets.fromLTRB(16, 10, 16, 16),
                      decoration: BoxDecoration(
                        color: Theme.of(context).brightness == Brightness.dark ? kEmeraldDeep : Colors.white,
                        borderRadius: const BorderRadius.vertical(top: Radius.circular(26)),
                        boxShadow: [BoxShadow(color: Colors.black.withValues(alpha: 0.08), blurRadius: 18)],
                      ),
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          SizedBox(
                            height: 22,
                            child: Row(
                              mainAxisAlignment: MainAxisAlignment.center,
                              children: List.generate(22, (i) {
                                final h = _recording ? (5 + _amp * 16 * (0.4 + 0.6 * sin(_seconds * 3 + i * 0.7).abs())).clamp(5.0, 21.0) : 5.0;
                                return AnimatedContainer(
                                  duration: const Duration(milliseconds: 120),
                                  margin: const EdgeInsets.symmetric(horizontal: 2),
                                  width: 3,
                                  height: h,
                                  decoration: BoxDecoration(color: i % 3 == 0 ? kGold : kEmerald, borderRadius: BorderRadius.circular(4)),
                                );
                              }),
                            ),
                          ),
                          const SizedBox(height: 6),
                          Text(
                            _liveHeard.isNotEmpty ? 'سمعت: «$_liveHeard»' : _statusText,
                            maxLines: 1,
                            overflow: TextOverflow.ellipsis,
                            style: const TextStyle(fontSize: 11.5, color: kMuted),
                          ),
                          const SizedBox(height: 10),
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceAround,
                            children: [
                              TextButton(
                                onPressed: () => setState(() => _peek = !_peek),
                                child: Text(_peek ? 'أخفِ الآية' : 'أظهر الآية', style: const TextStyle(fontFamily: 'Cairo', fontWeight: FontWeight.bold, color: kEmerald)),
                              ),
                              GestureDetector(
                                onTap: _toggleRec,
                                child: RotationTransition(
                                  turns: _orbCtrl,
                                  child: Container(
                                    width: 78,
                                    height: 78,
                                    decoration: BoxDecoration(
                                      shape: BoxShape.circle,
                                      gradient: const SweepGradient(colors: [kEmerald, Color(0xFF177B5D), kGold, kEmerald]),
                                      boxShadow: [BoxShadow(color: kEmerald.withValues(alpha: 0.35), blurRadius: 16)],
                                    ),
                                    child: _modelLoading
