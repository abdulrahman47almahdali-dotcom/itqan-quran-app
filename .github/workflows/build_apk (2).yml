            Future<void> _boot() async {
              await _state.load();
              try {
                final link = await _deepLinkChannel.invokeMethod<String>('getInitialLink');
                if (link != null && link.contains('ITQAN-')) {
                  _state.pendingDeepLinkRoom = link.substring(link.indexOf('ITQAN-')).split(RegExp(r'[\s/?#]')).first.toUpperCase();
