name: Build ITQAN v6 Offline Quran AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Initialize Flutter Android project
        run: |
          flutter create --platforms=android --org com.almahdali --project-name itqan_quran .
          mkdir -p assets/fonts assets/images assets/data assets/models lib

      - name: Download On-Device Offline Quran AI Model (Tarteel Whisper Quran Tiny INT8 for sherpa-onnx)
        run: |
          curl -fSL "https://huggingface.co/rifartboy/mutqin-asr/resolve/main/models/quran-tiny/encoder.int8.onnx" -o assets/models/encoder.int8.onnx
          curl -fSL "https://huggingface.co/rifartboy/mutqin-asr/resolve/main/models/quran-tiny/decoder.int8.onnx" -o assets/models/decoder.int8.onnx
          curl -fSL "https://huggingface.co/rifartboy/mutqin-asr/resolve/main/models/quran-tiny/tokens.txt" -o assets/models/tokens.txt
          ls -lh assets/models/

      - name: Bundle Complete 604-Page Madinah Mushaf, Arabic Fonts & Clean Arch Background
        run: |
          npm install --no-save quran-json@3.1.2 @fontsource/amiri-quran @fontsource/cairo @fontsource/tajawal
          python3 -m pip install --break-system-packages -q pillow fonttools brotli
          python3 - << 'PREP_EOF'
          import glob
          import json
          import math
          import urllib.request
          from pathlib import Path
          from fontTools.ttLib import TTFont
          from PIL import Image, ImageDraw

          surahs_out = []
          try:
              req = urllib.request.Request(
                  "https://api.alquran.cloud/v1/quran/quran-uthmani",
                  headers={"User-Agent": "ITQAN-Builder/6.0"},
              )
              with urllib.request.urlopen(req, timeout=45) as resp:
                  raw = json.loads(resp.read().decode("utf-8"))
              for s in raw["data"]["surahs"]:
                  ayahs = []
                  for a in s["ayahs"]:
                      txt = a["text"]
                      if s["number"] not in (1, 9) and a["numberInSurah"] == 1:
                          bism = "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ "
                          if txt.startswith(bism):
                              txt = txt[len(bism):].strip()
                      ayahs.append({"n": a["numberInSurah"], "t": txt, "p": a.get("page", 1), "j": a.get("juz", 1)})
                  surahs_out.append({
                      "num": s["number"],
                      "name": s["name"],
                      "type": "مكية" if s.get("revelationType") == "Meccan" else "مدنية",
                      "page": ayahs[0]["p"] if ayahs else 1,
                      "ayahs": ayahs,
                  })
          except Exception:
              with open("node_modules/quran-json/dist/quran.json", "r", encoding="utf-8") as f:
                  raw = json.load(f)
              for s in raw:
                  ayahs = [{"n": v["id"], "t": v["text"], "p": 1, "j": 1} for v in s["verses"]]
                  surahs_out.append({
                      "num": s["id"],
                      "name": "سورة " + s["name"],
                      "type": "مكية" if s.get("type") == "meccan" else "مدنية",
                      "page": 1,
                      "ayahs": ayahs,
                  })

          assert len(surahs_out) == 114
          assert sum(len(s["ayahs"]) for s in surahs_out) == 6236
          with open("assets/data/quran_full.json", "w", encoding="utf-8") as f:
              json.dump(surahs_out, f, ensure_ascii=False, separators=(",", ":"))

          def convert_font(pkg, weight, out_path):
              matches = sorted(glob.glob(f"node_modules/@fontsource/{pkg}/files/*arabic*{weight}*.woff2"))
              if not matches:
                  matches = sorted(glob.glob(f"node_modules/@fontsource/{pkg}/files/*.woff2"))
              font = TTFont(matches[0])
              font.flavor = None
              font.save(out_path)

          convert_font("amiri-quran", "400", "assets/fonts/AmiriQuran-Regular.ttf")
          convert_font("cairo", "700", "assets/fonts/Cairo-Bold.ttf")
          convert_font("tajawal", "400", "assets/fonts/Tajawal-Regular.ttf")
          convert_font("tajawal", "700", "assets/fonts/Tajawal-Bold.ttf")

          def draw_star(draw, cx, cy, r_outer, r_inner, points, color):
              pts = []
              for i in range(points * 2):
                  ang = math.pi * i / points - math.pi / 2
                  r = r_outer if i % 2 == 0 else r_inner
                  pts.append((cx + r * math.cos(ang), cy + r * math.sin(ang)))
              draw.polygon(pts, outline=color)

          bg = Image.new("RGB", (1080, 1920), (11, 61, 46))
          d = ImageDraw.Draw(bg)
          for y in range(1920):
              t = y / 1920.0
              d.line([(0, y), (1080, y)], fill=(int(14 * (1 - t) + 5 * t), int(72 * (1 - t) + 32 * t), int(54 * (1 - t) + 24 * t)))
          d.rounded_rectangle((36, 36, 1044, 1884), radius=34, outline=(201, 162, 39), width=4)
          d.rounded_rectangle((56, 56, 1024, 1864), radius=28, outline=(95, 130, 108), width=2)
          d.arc((110, 140, 970, 1060), 180, 360, fill=(201, 162, 39), width=5)
          d.arc((140, 170, 940, 1030), 180, 360, fill=(232, 213, 149), width=2)
          d.line([(110, 600), (110, 1760)], fill=(201, 162, 39), width=4)
          d.line([(970, 600), (970, 1760)], fill=(201, 162, 39), width=4)
          draw_star(d, 540, 440, 155, 78, 8, (201, 162, 39))
          draw_star(d, 540, 440, 118, 58, 8, (232, 213, 149))
          d.rounded_rectangle((385, 360, 534, 520), radius=14, outline=(232, 213, 149), width=6)
          d.rounded_rectangle((546, 360, 695, 520), radius=14, outline=(232, 213, 149), width=6)
          bg.save("assets/images/itqan_bg.png", "PNG")

          icon = Image.new("RGB", (512, 512), (11, 61, 46))
          idraw = ImageDraw.Draw(icon)
          idraw.ellipse((20, 20, 492, 492), fill=(6, 36, 27), outline=(201, 162, 39), width=14)
          draw_star(idraw, 256, 256, 170, 86, 8, (201, 162, 39))
          idraw.rounded_rectangle((170, 185, 252, 325), radius=10, outline=(232, 213, 149), width=8)
          idraw.rounded_rectangle((260, 185, 342, 325), radius=10, outline=(232, 213, 149), width=8)
          for folder, sz in [("mipmap-mdpi", 48), ("mipmap-hdpi", 72), ("mipmap-xhdpi", 96), ("mipmap-xxhdpi", 144), ("mipmap-xxxhdpi", 192)]:
              out = Path(f"android/app/src/main/res/{folder}")
              out.mkdir(parents=True, exist_ok=True)
              icon.resize((sz, sz), Image.Resampling.LANCZOS).save(out / "ic_launcher.png", "PNG")
          PREP_EOF
          rm -rf node_modules package.json package-lock.json

      - name: Write pubspec.yaml
        run: |
          cat << 'YAML_EOF' > pubspec.yaml
          name: itqan_quran
          description: تطبيق إتقان - ITQAN بذكاء اصطناعي قرآني مدمج بدون إنترنت
          publish_to: 'none'
          version: 6.0.0+7
          environment:
            sdk: '>=3.2.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            shared_preferences: ^2.2.3
            flutter_tts: ^4.0.2
            flutter_local_notifications: ^17.2.2
            share_plus: ^10.1.4
            url_launcher: ^6.3.1
            record: ^6.2.1
            audioplayers: ^6.8.1
            path_provider: ^2.1.6
            http: ^1.6.0
            sherpa_onnx: ^2.0.3
          flutter:
            uses-material-design: true
            assets:
              - assets/images/itqan_bg.png
              - assets/data/quran_full.json
              - assets/models/encoder.int8.onnx
              - assets/models/decoder.int8.onnx
              - assets/models/tokens.txt
            fonts:
              - family: AmiriQuran
                fonts:
                  - asset: assets/fonts/AmiriQuran-Regular.ttf
              - family: Cairo
                fonts:
                  - asset: assets/fonts/Cairo-Bold.ttf
                    weight: 700
              - family: Tajawal
                fonts:
                  - asset: assets/fonts/Tajawal-Regular.ttf
                  - asset: assets/fonts/Tajawal-Bold.ttf
                    weight: 700
          YAML_EOF

      - name: Write ITQAN v6.0 lib/main.dart
        run: |
          cat << 'DART_EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'dart:math';
          import 'dart:typed_data';
          import 'dart:ui' as ui;
          import 'package:flutter/material.dart';
          import 'package:flutter/rendering.dart';
          import 'package:flutter/services.dart';
          import 'package:flutter_localizations/flutter_localizations.dart';
          import 'package:flutter_tts/flutter_tts.dart';
          import 'package:flutter_local_notifications/flutter_local_notifications.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:share_plus/share_plus.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'package:record/record.dart';
          import 'package:audioplayers/audioplayers.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:http/http.dart' as http;
          import 'package:sherpa_onnx/sherpa_onnx.dart' as sherpa_onnx;

          final notificationsPlugin = FlutterLocalNotificationsPlugin();
          const _deepLinkChannel = MethodChannel('com.almahdali.itqan/deeplink');

          // ============================================================================
          // ITQAN EXCLUSIVE PALETTE (Deep Mushaf Emerald & Soft Gold)
          // ============================================================================
          const kEmerald = Color(0xFF0B3D2E);
          const kEmeraldDeep = Color(0xFF06241B);
          const kEmeraldSoft = Color(0xFFEAF3EF);
          const kGold = Color(0xFFC9A227);
          const kGoldLight = Color(0xFFE8D595);
          const kPaper = Color(0xFFFAF8F2);
          const kInk = Color(0xFF10241D);
          const kMuted = Color(0xFF5D6E67);
          const kBorder = Color(0xFFE5DFCE);
          const kDanger = Color(0xFFC0392B);
          const kDangerBg = Color(0xFFFDECEC);

          const kTajGhunnah = Color(0xFFB58900);
          const kTajQalqalah = Color(0xFF147A5E);
          const kTajMadd = Color(0xFF1A6B8A);
          const kTajIdgham = Color(0xFFA0522D);

          const kDefaultFirebaseUrl = 'https://itqan-quran-71868-default-rtdb.firebaseio.com';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            try {
              await notificationsPlugin.initialize(
                const InitializationSettings(android: AndroidInitializationSettings('@mipmap/ic_launcher')),
              );
            } catch (_) {}
            runApp(const ItqanV6App());
          }

          // ============================================================================
          // MODELS
          // ============================================================================
          class AyahModel {
            final int num;
            final String text;
            final int page;
            final int juz;
            const AyahModel({required this.num, required this.text, required this.page, required this.juz});
          }

          class SurahModel {
            final int num;
            final String name;
            final String type;
            final int page;
            final List<AyahModel> ayahs;
            const SurahModel({required this.num, required this.name, required this.type, required this.page, required this.ayahs});
          }

          class TajweedRuleNote {
            final String word;
            final String rule;
            final String note;
            final Color color;
            const TajweedRuleNote({required this.word, required this.rule, required this.note, required this.color});
          }

          class ReciteMistake {
            final int ayahNum;
            final String expected;
            final String heard;
            const ReciteMistake({required this.ayahNum, required this.expected, required this.heard});
          }

          class VoiceNoteItem {
            final String title;
            final String path;
            final String dateStr;
            const VoiceNoteItem({required this.title, required this.path, required this.dateStr});
            Map<String, dynamic> toJson() => {'t': title, 'p': path, 'd': dateStr};
            factory VoiceNoteItem.fromJson(Map<String, dynamic> m) =>
                VoiceNoteItem(title: m['t'] ?? '', path: m['p'] ?? '', dateStr: m['d'] ?? '');
          }

          // ============================================================================
          // ON-DEVICE OFFLINE QURAN AI ENGINE (sherpa_onnx + Tarteel Whisper Quran INT8)
          // ZERO INTERNET • ZERO ANDROID BEEP • REAL-TIME ON-DEVICE RECOGNITION!
          // ============================================================================
          class OfflineQuranAiEngine {
            static sherpa_onnx.OfflineRecognizer? _recognizer;
            static bool _initializing = false;
            static String? lastError;

            static bool get isReady => _recognizer != null;

            static Future<bool> ensureInitialized() async {
              if (_recognizer != null) return true;
              if (_initializing) {
                while (_initializing) {
                  await Future.delayed(const Duration(milliseconds: 120));
                }
                return _recognizer != null;
              }
              _initializing = true;
              lastError = null;
              try {
                await sherpa_onnx.initBindingsAsync();
                final docDir = await getApplicationDocumentsDirectory();
                final modelDir = Directory('${docDir.path}/itqan_quran_asr');
                if (!modelDir.existsSync()) modelDir.createSync(recursive: true);

                final encFile = File('${modelDir.path}/encoder.int8.onnx');
                final decFile = File('${modelDir.path}/decoder.int8.onnx');
                final tokFile = File('${modelDir.path}/tokens.txt');

                Future<void> copyIfMissing(String assetKey, File target) async {
                  if (target.existsSync() && target.lengthSync() > 1024) return;
                  final data = await rootBundle.load(assetKey);
                  final bytes = data.buffer.asUint8List(data.offsetInBytes, data.lengthInBytes);
                  await target.writeAsBytes(bytes, flush: true);
                }

                await copyIfMissing('assets/models/encoder.int8.onnx', encFile);
                await copyIfMissing('assets/models/decoder.int8.onnx', decFile);
                await copyIfMissing('assets/models/tokens.txt', tokFile);

                final whisper = sherpa_onnx.OfflineWhisperModelConfig(
                  encoder: encFile.path,
                  decoder: decFile.path,
                  language: 'ar',
                  task: 'transcribe',
                );
                final modelConfig = sherpa_onnx.OfflineModelConfig(
                  whisper: whisper,
                  tokens: tokFile.path,
                  modelType: 'whisper',
                  numThreads: 2,
                );
                final config = sherpa_onnx.OfflineRecognizerConfig(model: modelConfig);
                _recognizer = sherpa_onnx.OfflineRecognizer(config);
                return true;
              } catch (e) {
                lastError = 'تعذّر تهيئة نموذج الذكاء الاصطناعي المحلي: $e';
                return false;
              } finally {
                _initializing = false;
              }
            }

            /// Decodes raw PCM16 (16kHz Mono) directly on-device with zero internet!
            static String transcribePcm16(Uint8List pcmBytes) {
              final rec = _recognizer;
              if (rec == null || pcmBytes.length < 3200) return '';
              final sampleCount = pcmBytes.length ~/ 2;
              final floats = Float32List(sampleCount);
              final bd = ByteData.sublistView(pcmBytes);
              for (int i = 0; i < sampleCount; i++) {
                floats[i] = bd.getInt16(i * 2, Endian.little) / 32768.0;
              }
              final stream = rec.createStream();
              try {
                stream.acceptWaveform(samples: floats, sampleRate: 16000);
                rec.decode(stream);
                final res = rec.getResult(stream);
                return res.text.trim();
              } finally {
                stream.free();
              }
            }

            static Uint8List wrapPcmToWav(Uint8List pcmBytes, {int sampleRate = 16000}) {
              final byteRate = sampleRate * 2;
              final dataSize = pcmBytes.length;
              final header = ByteData(44);
              void wStr(int off, String s) {
                for (int i = 0; i < s.length; i++) {
                  header.setUint8(off + i, s.codeUnitAt(i));
                }
              }
              wStr(0, 'RIFF');
              header.setUint32(4, 36 + dataSize, Endian.little);
              wStr(8, 'WAVE');
              wStr(12, 'fmt ');
              header.setUint32(16, 16, Endian.little);
              header.setUint16(20, 1, Endian.little);
              header.setUint16(22, 1, Endian.little);
              header.setUint32(24, sampleRate, Endian.little);
              header.setUint32(28, byteRate, Endian.little);
              header.setUint16(32, 2, Endian.little);
              header.setUint16(34, 16, Endian.little);
              wStr(36, 'data');
              header.setUint32(40, dataSize, Endian.little);
              final out = Uint8List(44 + dataSize);
              out.setRange(0, 44, header.buffer.asUint8List());
              out.setRange(44, 44 + dataSize, pcmBytes);
              return out;
            }
          }

          // ============================================================================
          // SMART UTHMANI-TO-ARABIC MATCHER + TAJWEED ANALYZER
          // ============================================================================
          class QuranEngine {
            static final _diacritics = RegExp(r'[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640\u06DF-\u06E8\u06EA-\u06ED\u08D3-\u08FF]');
            static final _nonArabic = RegExp(r'[^\u0621-\u064A\s]');
            static const _qalqalah = {'ق', 'ط', 'ب', 'ج', 'د'};
            static const _idgham = {'ي', 'ر', 'م', 'ل', 'و', 'ن'};
            static const _ikhfa = {'ص', 'ذ', 'ث', 'ك', 'ج', 'ش', 'ق', 'س', 'د', 'ط', 'ز', 'ف', 'ت', 'ض', 'ظ'};
            static final _tanween = RegExp(r'[\u064B\u064C\u064D]');
            static const _sukun = '\u0652';
            static const _uthmaniSukun = '\u06E1';
            static const _shadda = '\u0651';
            static const _maddSign = '\u0653';

            static String normalize(String input) {
              var s = input.replaceAll(_diacritics, '');
              s = s.replaceAll('ٱ', 'ا').replaceAll(RegExp(r'[أإآ]'), 'ا').replaceAll('ى', 'ي').replaceAll('ة', 'ه').replaceAll('ؤ', 'و').replaceAll('ئ', 'ي').replaceAll('ـ', '');
              return s.replaceAll(_nonArabic, '').trim();
            }

            static String skeleton(String w) {
              final n = normalize(w);
              if (n.length <= 2) return n;
              return n[0] + n.substring(1).replaceAll('ا', '');
            }

            static int levenshtein(String a, String b) {
              if (a == b) return 0;
              if (a.isEmpty) return b.length;
              if (b.isEmpty) return a.length;
              var prev = List<int>.generate(b.length + 1, (i) => i);
              for (int i = 1; i <= a.length; i++) {
                final curr = List<int>.filled(b.length + 1, 0);
                curr[0] = i;
                for (int j = 1; j <= b.length; j++) {
                  final cost = a[i - 1] == b[j - 1] ? 0 : 1;
                  curr[j] = min(min(curr[j - 1] + 1, prev[j] + 1), prev[j - 1] + cost);
                }
                prev = curr;
              }
              return prev[b.length];
            }

            static bool wordsMatch(String expectedRaw, String spokenRaw) {
              final e = normalize(expectedRaw);
              final s = normalize(spokenRaw);
              if (e.isEmpty || s.isEmpty) return false;
              if (e == s) return true;
              final es = skeleton(e);
              final ss = skeleton(s);
              if (es == ss) return true;
              if (e.length >= 4 && s.length >= 4 && levenshtein(es, ss) <= 1) return true;
              if (e.length >= 6 && s.length >= 6 && levenshtein(e, s) <= 2) return true;
              return false;
            }

            static String toArabicDigits(int n) {
              const digits = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
              return n.toString().split('').map((c) {
                final d = int.tryParse(c);
                return d != null ? digits[d] : c;
              }).join();
            }

            static String firstLetterHint(String word) {
              final c = word.trim();
              if (c.isEmpty) return '';
              int end = 1;
              while (end < c.length && _diacritics.hasMatch(c[end])) {
                end++;
              }
              return '${c.substring(0, end)}...';
            }

            static String _firstBase(String w) {
              for (int i = 0; i < w.length; i++) {
                final code = w.codeUnitAt(i);
                if (code >= 0x0621 && code <= 0x064A && w[i] != 'ٱ') return w[i];
              }
              return '';
            }

            static TajweedRuleNote? analyzeWord(String word, String? nextWord) {
              if (word.contains(_maddSign)) {
                return TajweedRuleNote(word: word, rule: 'مدّ (متصل / منفصل / لازم)', note: 'أطل صوت المدّ من ٤ إلى ٦ حركات بحسب نوعه.', color: kTajMadd);
              }
              if (word.contains('ن$_shadda') || word.contains('م$_shadda')) {
                return TajweedRuleNote(word: word, rule: 'غنة مشددة (حركتان)', note: 'أظهر الغنة من الخيشوم بمقدار حركتين كاملتين.', color: kTajGhunnah);
              }
              final hasTanween = _tanween.hasMatch(word);
              final endsNoon = word.endsWith('ن$_sukun') || word.endsWith('ن$_uthmaniSukun') || word.endsWith('ن');
              if ((hasTanween || endsNoon) && nextWord != null && nextWord.isNotEmpty) {
                final nxt = _firstBase(nextWord);
                if (nxt == 'ب') return TajweedRuleNote(word: word, rule: 'إقلاب بغنة', note: 'اقلب النون أو التنوين ميمًا مخفاة بغنة حركتين.', color: kTajIdgham);
                if (_idgham.contains(nxt)) {
                  final gh = {'ي', 'ن', 'م', 'و'}.contains(nxt);
                  return TajweedRuleNote(word: word, rule: gh ? 'إدغام بغنة' : 'إدغام بغير غنة', note: gh ? 'أدغم مع غنة حركتين.' : 'أدغم إدغامًا كاملًا دون غنة.', color: kTajIdgham);
                }
                if (_ikhfa.contains(nxt)) return TajweedRuleNote(word: word, rule: 'إخفاء حقيقي', note: 'أخفِ النون الساكنة أو التنوين بغنة حركتين.', color: kTajIdgham);
              }
              for (final ch in _qalqalah) {
                if (word.contains('$ch$_sukun') || word.contains('$ch$_uthmaniSukun')) {
                  return TajweedRuleNote(word: word, rule: 'قلقلة (قطب جد)', note: 'أظهر نبرة القلقلة في حرف «$ch» الساكن.', color: kTajQalqalah);
                }
              }
              return null;
            }

            static List<TajweedRuleNote> analyzeAyah(String text) {
              final words = text.split(RegExp(r'\s+')).where((w) => w.isNotEmpty).toList();
              final out = <TajweedRuleNote>[];
              for (int i = 0; i < words.length; i++) {
                final n = analyzeWord(words[i], i + 1 < words.length ? words[i + 1] : null);
                if (n != null) out.add(n);
              }
              return out;
            }
          }

          // ============================================================================
          // FIREBASE REALTIME DATABASE SERVICE (5-PERSON LIVE ROOMS + DEEP LINKS)
          // ============================================================================
          class FirebaseRoomService {
            static String cleanUrl(String raw) {
              var u = raw.trim();
              if (u.endsWith('/')) u = u.substring(0, u.length - 1);
              if (u.isNotEmpty && !u.startsWith('https://')) u = 'https://$u';
              return u;
            }

            static Future<String> testConnection(String dbUrl) async {
              try {
                final r = await http.get(Uri.parse('${cleanUrl(dbUrl)}/itqan_ping.json')).timeout(const Duration(seconds: 10));
                if (r.statusCode == 200) return 'متصل بنجاح بقاعدة بيانات Firebase ✓';
                return 'رد الخادم برمز ${r.statusCode} — تأكد من قواعد Rules في Firebase.';
              } catch (_) {
                return 'تعذّر الاتصال بـ Firebase — تأكد من توفر الإنترنت.';
              }
            }

            static Future<String?> createRoom({
              required String dbUrl,
              required String roomCode,
              required int surahNum,
              required String surahName,
              required String hostId,
              required String hostName,
            }) async {
              try {
                final payload = {
                  'code': roomCode,
                  'surahNum': surahNum,
                  'surahName': surahName,
                  'maxMembers': 5,
                  'createdAt': DateTime.now().toIso8601String(),
                  'members': {
                    hostId: {'name': hostName, 'done': false, 'score': 0},
                  },
                };
                final r = await http
                    .put(Uri.parse('${cleanUrl(dbUrl)}/itqan_rooms/$roomCode.json'), headers: {'Content-Type': 'application/json'}, body: jsonEncode(payload))
                    .timeout(const Duration(seconds: 12));
                if (r.statusCode == 200) return null;
                return 'فشل إنشاء الغرفة (رمز ${r.statusCode}) — تأكد من Firebase Rules.';
              } catch (_) {
                return 'تعذّر الاتصال بـ Firebase — تأكد من توفر الإنترنت.';
              }
            }

            static Future<Map<String, dynamic>?> fetchRoom(String dbUrl, String roomCode) async {
              try {
                final r = await http.get(Uri.parse('${cleanUrl(dbUrl)}/itqan_rooms/$roomCode.json')).timeout(const Duration(seconds: 12));
                if (r.statusCode == 200 && r.body != 'null') return jsonDecode(r.body) as Map<String, dynamic>;
                return null;
              } catch (_) {
                return null;
              }
            }

            static Future<String?> joinOrUpdateMember({
              required String dbUrl,
              required String roomCode,
              required String memberId,
              required String name,
              required bool done,
              required int score,
            }) async {
              try {
                final current = await fetchRoom(dbUrl, roomCode);
                if (current == null) return 'لم يتم العثور على غرفة بهذا الرمز.';
                final members = (current['members'] as Map<String, dynamic>?) ?? {};
                if (!members.containsKey(memberId) && members.length >= 5) return 'الغرفة مكتملة (٥ من ٥ أشخاص).';
                final r = await http
                    .put(
                      Uri.parse('${cleanUrl(dbUrl)}/itqan_rooms/$roomCode/members/$memberId.json'),
                      headers: {'Content-Type': 'application/json'},
                      body: jsonEncode({'name': name, 'done': done, 'score': score}),
                    )
                    .timeout(const Duration(seconds: 12));
                return r.statusCode == 200 ? null : 'تعذّر الانضمام (${r.statusCode}).';
              } catch (_) {
                return 'تعذّر الاتصال بالإنترنت.';
              }
            }
          }

          // ============================================================================
          // APP STATE
          // ============================================================================
          class ItqanState extends ChangeNotifier {
            ThemeMode themeMode = ThemeMode.light;
            double fontSize = 28.0;
            bool tajweedColors = true;
            String studentName = '';
            String firebaseUrl = kDefaultFirebaseUrl;
            String pendingDeepLinkRoom = '';
            String memberId = '';
            Set<int> masteredSurahs = {1};
            List<VoiceNoteItem> recordings = [];

            Future<void> load() async {
              final p = await SharedPreferences.getInstance();
              themeMode = (p.getBool('itq_dark') ?? false) ? ThemeMode.dark : ThemeMode.light;
              fontSize = p.getDouble('itq_font') ?? 28.0;
              tajweedColors = p.getBool('itq_tajweed') ?? true;
              studentName = p.getString('itq_name') ?? '';
              final fb = p.getString('itq_fb_url') ?? '';
              firebaseUrl = fb.isEmpty ? kDefaultFirebaseUrl : fb;
              memberId = p.getString('itq_uid') ?? 'u_${10000 + Random().nextInt(89999)}';
              await p.setString('itq_uid', memberId);

              final m = p.getStringList('itq_mastered');
              if (m != null) masteredSurahs = m.map((e) => int.tryParse(e) ?? 1).toSet();
              final rRaw = p.getString('itq_recs');
              if (rRaw != null) {
                try {
                  recordings = (jsonDecode(rRaw) as List).map((e) => VoiceNoteItem.fromJson(e)).toList();
                } catch (_) {}
              }
              notifyListeners();
            }

            Future<void> save() async {
              final p = await SharedPreferences.getInstance();
              await p.setBool('itq_dark', themeMode == ThemeMode.dark);
              await p.setDouble('itq_font', fontSize);
              await p.setBool('itq_tajweed', tajweedColors);
              await p.setString('itq_name', studentName);
              await p.setString('itq_fb_url', firebaseUrl);
              await p.setStringList('itq_mastered', masteredSurahs.map((e) => '$e').toList());
              await p.setString('itq_recs', jsonEncode(recordings.take(60).map((e) => e.toJson()).toList()));
              notifyListeners();
            }
          }

