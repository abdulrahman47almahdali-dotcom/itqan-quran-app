          DART_EOF

      - name: Configure Native Deep Link Channel, AndroidManifest, noCompress ONNX & Gradle
        run: |
          python3 - << 'PY_EOF'
          from pathlib import Path
          import re

          mp = Path("android/app/src/main/AndroidManifest.xml")
          txt = mp.read_text(encoding="utf-8")
          txt = re.sub(r'android:label="[^"]*"', 'android:label="إتقان"', txt, count=1)
          perms = '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n'
          if "RECORD_AUDIO" not in txt:
              txt = txt.replace("<application", perms + "    <application", 1)
          deep_link = '            <intent-filter>\n                <action android:name="android.intent.action.VIEW"/>\n                <category android:name="android.intent.category.DEFAULT"/>\n                <category android:name="android.intent.category.BROWSABLE"/>\n                <data android:scheme="itqan" android:host="room"/>\n            </intent-filter>\n        </activity>'
          if 'android:scheme="itqan"' not in txt:
              txt = txt.replace("</activity>", deep_link, 1)
          mp.write_text(txt, encoding="utf-8")

          for kt in Path("android/app/src/main/kotlin").rglob("MainActivity.kt"):
              pkg_line = [l for l in kt.read_text(encoding="utf-8").splitlines() if l.startswith("package ")][0]
              kt.write_text(
                  pkg_line + "\n\n"
                  "import io.flutter.embedding.android.FlutterActivity\n"
                  "import io.flutter.embedding.engine.FlutterEngine\n"
                  "import io.flutter.plugin.common.MethodChannel\n\n"
                  "class MainActivity : FlutterActivity() {\n"
                  "    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {\n"
                  "        super.configureFlutterEngine(flutterEngine)\n"
                  "        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, \"com.almahdali.itqan/deeplink\").setMethodCallHandler { call, result ->\n"
                  "            if (call.method == \"getInitialLink\") {\n"
                  "                result.success(intent?.dataString)\n"
                  "            } else {\n"
                  "                result.notImplemented()\n"
                  "            }\n"
                  "        }\n"
                  "    }\n"
                  "}\n",
                  encoding="utf-8",
              )

          gp_kts = Path("android/app/build.gradle.kts")
          if gp_kts.exists():
              g = gp_kts.read_text(encoding="utf-8")
              g = re.sub(r"compileSdk\s*=\s*flutter\.compileSdkVersion", "compileSdk = 36", g)
              g = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 24", g)
              if "isCoreLibraryDesugaringEnabled" not in g:
                  g = g.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
              if "noCompress" not in g:
                  g = g.replace("compileOptions {", 'androidResources {\n        noCompress += listOf("onnx", "txt")\n    }\n    compileOptions {', 1)
              if "desugar_jdk_libs" not in g:
                  g += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")\n}\n'
              gp_kts.write_text(g, encoding="utf-8")

          gp_groovy = Path("android/app/build.gradle")
          if gp_groovy.exists():
              g = gp_groovy.read_text(encoding="utf-8")
              g = re.sub(r"compileSdk\s*=?\s*flutter\.compileSdkVersion", "compileSdk = 36", g)
              g = re.sub(r"compileSdkVersion\s+flutter\.compileSdkVersion", "compileSdkVersion 36", g)
              g = re.sub(r"minSdk\s*=?\s*flutter\.minSdkVersion", "minSdk = 24", g)
              g = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 24", g)
              if "coreLibraryDesugaringEnabled" not in g:
                  g = g.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true", 1)
              if "noCompress" not in g:
                  g = g.replace("compileOptions {", 'aaptOptions {\n        noCompress "onnx", "txt"\n    }\n    compileOptions {', 1)
              if "desugar_jdk_libs" not in g:
                  g += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'\n}\n"
              gp_groovy.write_text(g, encoding="utf-8")
          PY_EOF

