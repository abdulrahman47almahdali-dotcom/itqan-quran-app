                                    onTap: () => setState(() => _hintFirst = true),
                                    child: const Text('أول حرف', style: TextStyle(fontFamily: 'Cairo', fontWeight: FontWeight.bold, fontSize: 12, color: kGold)),
                                  ),
                                ],
                              ),
                            ],
                          ),
                        ],
                      ),
                    ),
